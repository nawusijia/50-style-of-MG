<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>娜乌斯嘉AI 片头</title>
<style>
  :root { --bg:#121419; --red:#FF4757; --yel:#F5C451; --bei:#ECE8E1; }
  html, body { margin:0; height:100%; background:#000; overflow:hidden; }
  #stage { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
           width:min(100vw, 177.7778vh); height:min(56.25vw, 100vh); display:block; background:var(--bg); }
  #play { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
          background:rgba(8,9,12,.35); }
  #play button { font:700 22px "Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif; letter-spacing:.12em;
          color:var(--bei); background:rgba(18,20,25,.85); border:2px solid var(--red); padding:14px 34px; cursor:pointer;
          box-shadow:0 0 24px rgba(255,71,87,.35); }
  #play button:hover { background:var(--red); color:#121419; }
  #play.hidden { display:none; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<div id="play"><button type="button">▶ 播放</button></div>
<audio id="music" src="music.wav" preload="auto"></audio>
<script>
(function () {
'use strict';
const W = 1920, H = 1080;
const stage = document.getElementById('stage');
const sctx = stage.getContext('2d');
const overlay = document.getElementById('play');
const audio = document.getElementById('music');
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const SC = mk(W, H); const ctx = SC.getContext('2d');      // scene buffer

// ------------------------------------------------------------------ math
const clamp = (x, a, b) => x < a ? a : (x > b ? b : x);
const c01 = x => clamp(x, 0, 1);
const lerp = (a, b, t) => a + (b - a) * t;
const eio = t => { t = c01(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const eo = t => { t = c01(t); return 1 - Math.pow(1 - t, 3); };
const eo2 = t => { t = c01(t); return 1 - (1 - t) * (1 - t); };
const ei = t => { t = c01(t); return t * t * t; };
const ei2 = t => { t = c01(t); return t * t; };
const esine = t => { t = c01(t); return (1 - Math.cos(Math.PI * t)) / 2; };
const eoBack = (t, s) => { t = c01(t); s = s === undefined ? 1.70158 : s; const c3 = s + 1; return 1 + c3 * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); };
const ss = (a, b, x) => { const t = c01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash2(i, j) { let h = (Math.imul(i | 0, 374761393) + Math.imul(j | 0, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return lerp(lerp(hash2(xi, yi), hash2(xi + 1, yi), u), lerp(hash2(xi, yi + 1), hash2(xi + 1, yi + 1), u), v);
}
const rgba = (c, a) => 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + (a === undefined ? 1 : +a.toFixed(4)) + ')';
const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const mulc = (c, k) => [c[0] * k, c[1] * k, c[2] * k];

// ------------------------------------------------------------------ palette (4 colours + their shades)
const BG = [18, 20, 25], RED = [255, 71, 87], YEL = [245, 196, 81], BEI = [236, 232, 225];
const TOPC = [235, 232, 224];                 // #EBE8E0  title upper half
const APRI = [240, 203, 160];                 // warm apricot lower half
const ORNG = [249, 136, 84];                  // "AI" lower half (yellow→red)
const HOT  = [247, 243, 235];                 // hottest highlight (never pure white)
const SH1  = [176, 38, 54], SH2 = [98, 20, 37];
const BGS = rgba(BG);

// ------------------------------------------------------------------ title glyphs (20×20 cells, hand-drawn pixel font)
const GLYPHS = [
 ["....................","..##....######.#####","..##....######.#####",".##......##.##.##.##",".##......##.##.##.##","#######..##.##.##.##","#######.######.####.",".##..##.######.####.",".##..##..##.##.##.##","..##.##..##.##.##.##","..####...##.##.##.##","...##...######.#####","..####..######.####.",".##..##..##.##.##...","##...##..##.##.##...","##...##.##..##.##...","........##.###.##...","...........##..##...","...............##...","...............##..."],
 ["........###.........",".......###..........","...##############...","...##############...","...##..........##...","...##..........##...","...##.....#######...","...##.....#######...","...##...............","...##...............","...###############..","...###############..","................##..",".#############..##..",".#############..##..","................##..","................##..","................##..","...........#######..","............#####..."],
 ["..##...##.........##","..##...##......#####","###########..#####..","###########..##.....","..##...##....##.....","..#######....##.....","..#######....#######","..##...##....#######","..#######....##..##.","..#######....##..##.","..##...##....##..##.","..##...##....##..##.","###########..##..##.","###########.##...##.","............##...##.","..##...##...##...##.",".##.....##.......##.","##.......##......##.",".................##.",".................##."],
 [".##################.",".##################.",".........##.........","....############....","....############....","....................","....############....","....############....","....##........##....","....############....","....############....",".....##......##.....",".##################.",".##################.","....................","..#######..########.","..#######..########.","...##..##..##....##.","..##...##..########.",".##..####..########."],
 ["...#####.....#######","..#######....#######",".###...###.....###..","###.....###....###..","###.....###....###..","###.....###....###..","###.....###....###..","###.....###....###..","###.....###....###..","###.....###....###..","###.....###....###..","###########....###..","###########....###..","###.....###....###..","###.....###....###..","###.....###....###..","###.....###....###..","###.....###....###..","###.....###..#######","###.....###..#######"]
];
const CELL = 11, GN = 20, GAPC = 2;
const GX = [0, 22, 44, 66, 88];                  // glyph column offsets (cells)
const PARTS = [[[0, 20]], [[0, 20]], [[0, 20]], [[0, 20]], [[0, 11], [11, 20]]];   // "AI" = A + I (separate hits)
const LW = 1600, LH = 760;                       // title layer (1 px = 1 screen px at S=1)
const OX = 190, OY = 300;                        // title origin inside the layer
const LCX = 800, LCY = OY + 110;                 // layer point that maps to the view centre
const TITLE_W = 108 * CELL;
const PERIOD_LX = OX + 110 * CELL, PERIOD_LY = OY + 20 * CELL;   // period: cols 109–110, rows 18–19 (centre-x, bottom)

function cellOn(k, r, c) { return GLYPHS[k][r] && GLYPHS[k][r][c] === '#'; }
function spriteFrom(k, colorFn) {
  const c = mk(GN, GN), g = c.getContext('2d'), im = g.createImageData(GN, GN);
  for (let r = 0; r < GN; r++) for (let q = 0; q < GN; q++) if (cellOn(k, r, q)) {
    const col = colorFn(r, q), i = (r * GN + q) * 4;
    im.data[i] = col[0]; im.data[i + 1] = col[1]; im.data[i + 2] = col[2]; im.data[i + 3] = 255;
  }
  g.putImageData(im, 0, 0); return c;
}
const SPR = GLYPHS.map((_, k) => ({
  fill: spriteFrom(k, r => r < 10 ? TOPC : APRI),
  fillY: spriteFrom(k, r => r < 10 ? YEL : ORNG),
  hot: spriteFrom(k, () => HOT),
  sh1: spriteFrom(k, () => SH1),
  sh2: spriteFrom(k, () => SH2),
}));
// slice boundaries in layer x (one slice per glyph, used for the slight 3-D yaw)
const SB = [0, OX + GX[1] * CELL, OX + GX[2] * CELL, OX + GX[3] * CELL, OX + GX[4] * CELL, LW];

// landing spots for the red pixel (centre col in title cells, surface row)
const SPOTS = [
  { k: 0, part: 0, cx: 10 }, { k: 1, part: 0, cx: 32 }, { k: 2, part: 0, cx: 54 },
  { k: 3, part: 0, cx: 76 }, { k: 4, part: 0, cx: 88 + 5.5 }, { k: 4, part: 1, cx: 88 + 16 }
];
SPOTS.forEach(s => {
  let top = GN;
  for (let c = Math.floor(s.cx - 3.5); c <= Math.ceil(s.cx + 3.5); c++) {
    const lc = c - GX[s.k]; if (lc < 0 || lc >= GN) continue;
    for (let r = 0; r < GN; r++) if (cellOn(s.k, r, lc)) { top = Math.min(top, r); break; }
  }
  s.lx = OX + s.cx * CELL; s.ly = OY + top * CELL;
});

// ------------------------------------------------------------------ timeline constants (shared with gen_audio.py)
const SWEEP0 = 2.8, SWEEPD = 0.3;                // char k is swept during [2.8+0.3k, 2.8+0.3k+0.3]
const LAND = [6.25, 6.5, 6.75, 7.0];             // quick hops on 娜乌斯嘉, then one big flip over AI into the period at 7.5
const T_PERIOD = 7.5;                            // period lands = glitch + subtitle reveal
const T_HOLD = 6.0;                              // glow peak; slow push-in / sway / scanlines from here to the CRT
const T_FLY = 5.8;                               // red pixel flies above 娜
const SUB_T0 = 7.5, SUB_LOCK0 = 7.58, SUB_LOCKD = 0.045;   // subtitle appears / lock times (done by ~10.1)
const T_SUBFL = 8.22;                           // subtitle shine + second sonic logo
const T_GLINT = 8.1, T_GLINTD = 0.62;           // glint across the title in the hold
const T_CRT = 9.0;                              // CRT switch-off
const GLOW_ON = 5.5;

function sweepU(k, t) { return c01((t - (SWEEP0 + SWEEPD * k)) / SWEEPD); }
function revealedCols(k, t) {
  if (t >= SWEEP0 + SWEEPD * (k + 1)) return GN;
  const u = sweepU(k, t); return Math.floor(GN * esine(u) + 1e-6);
}
function bandLX(k, t) { return OX + (GX[k] + GN * esine(sweepU(k, t))) * CELL; }

// ------------------------------------------------------------------ opening: camera / road
const T_STR = 1.4;                               // road straightens, car speeds into the sun
const T_BOOM = 2.0;                              // sun explosion
function speed(t) {
  if (t < 0.5) { const u = t / 0.5; return 950 + 1900 * (1 - u) * (1 - u); }
  if (t < T_STR) { const u = (t - 0.5) / (T_STR - 0.5); return 950 + 1650 * u * u; }
  if (t < 1.75) return lerp(2600, 520, eo((t - T_STR) / 0.35));
  if (t < 2.0) return lerp(520, 300, (t - 1.75) / 0.25);
  return 300;
}
const ZT = new Float64Array(4401);
(function () { let z = 0; for (let i = 1; i <= 4400; i++) { z += (speed((i - 1) / 1000) + speed(i / 1000)) / 2000; ZT[i] = z; } })();
function zcAt(t) { const x = clamp(t, 0, 4.399) * 1000, i = Math.floor(x); return lerp(ZT[i], ZT[i + 1], x - i); }
function tAtZ(z) {
  if (z <= 0) return z / 2850;
  if (z >= ZT[4400]) return 4.4 + (z - ZT[4400]) / 300;
  let lo = 0, hi = 4400;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (ZT[m] <= z) lo = m; else hi = m; }
  return (lo + (z - ZT[lo]) / (ZT[hi] - ZT[lo])) / 1000;
}
const ROAD_K = 1.6;                              // bends tighten as the car accelerates
const roadPh = tau => 4.49 * tau + ROAD_K * tau * tau - 0.98;
function roadXt(tau) {
  const tc = clamp(tau, -0.2, T_STR + 0.1);
  const dph = 4.49 + 2 * ROAD_K * tc;
  const A = lerp(0.19, 0.25, c01(tc / T_STR)) * speed(clamp(tau, 0, T_STR)) / dph * (1 - ss(1.05, T_STR, tau));
  return A * Math.sin(roadPh(tau));
}
const roadX = z => roadXt(tAtZ(z));
function latAcc(tau) { const h = 0.01; return (roadXt(tau + h) - 2 * roadXt(tau) + roadXt(tau - h)) / (h * h); }
let LATMAX = 1;
(function () { let m = 0; for (let x = 0; x <= T_STR; x += 0.005) m = Math.max(m, Math.abs(latAcc(x))); LATMAX = m; })();
// bank into the curve: proportional to the road's lateral acceleration (−sinΦ), growing from ~4.5° to ~7.5° as the bends tighten
const bankAt = tau => -(Math.PI / 180) * lerp(4.6, 7.6, c01(tau / T_STR)) * Math.sin(roadPh(tau)) * (1 - ss(1.05, T_STR, tau));
function suck(t) { return t < 1.6 ? 0 : 600 * ei((t - 1.6) / 0.4); }
function carD(t) { return t < T_STR ? 180 : 180 + 6500 * ei((t - T_STR) / 0.55); }

function camOpen(t) {
  const zc = zcAt(t);
  const camX = roadXt(t);
  const L = 320;
  const psi = Math.atan2(roadX(zc + L) - camX, L);
  let f = lerp(800, 900, eo(t / 0.6));
  f *= 1 + 0.09 * eio((t - 1.72) / 0.28);
  const sp = speed(t) / 2000;
  const bump = (2.2 * Math.sin(t * 31) + 1.3 * Math.sin(t * 47 + 1.3) + 0.8 * Math.sin(t * 73 + 0.4)) * clamp(sp, 0.2, 1.3);
  return { zc, zg: zc - suck(t), camX, psi, f, yh: 520, camH: 34, mf: 1, gb: 1, roll: -bankAt(t), bump, road: 1, t };
}
function camWorld(t) {
  // after the explosion: terrain sinks, horizon drops, slow drift, gentle 3-D sway
  const c4 = camOpen(T_BOOM);
  const zg4 = c4.zg;
  const dt = t - T_BOOM;
  const zg = zg4 - 4200 * 0.12 * (1 - Math.exp(-dt / 0.12)) + 110 * dt;
  const k = eo(dt / 0.7);
  const tilt = 0.022 * Math.sin(2 * Math.PI * (t - T_HOLD) / 7) * ss(T_HOLD, T_HOLD + 1, t);
  const psi = 0.03 * Math.sin(0.45 * dt) * ss(2, 3, t) + tilt;
  const f = lerp(c4.f, 900, eio(dt / 0.8)) * VIEW.S;
  return { zc: 0, zg, camX: 0, psi, f, yh: lerp(520, 640, eio(dt / 0.8)) + VIEW.dyWorld, camH: 34,
           mf: 1 - eo(dt / 0.6), gb: lerp(1, 0.4, eo(dt / 0.6)) * (1 + 0.22 * kickPulse(t)),
           roll: 0.0045 * Math.sin(2 * Math.PI * (t - T_HOLD) / 5.5) * ss(T_HOLD, T_HOLD + 1, t), bump: 0, road: 0, t };
}
function kickPulse(t) {
  if (t < T_BOOM || t >= T_CRT - 0.25) return 0;
  const b = Math.floor(t * 2) / 2; return Math.exp(-(t - b) / 0.12);
}

function terrH(u, z) {
  const d = Math.abs(u) - 92; if (d <= 0) return 0;
  const n = vnoise(u * 0.006 + 7.3, z * 0.0042) * 0.85 + vnoise(u * 0.019 + 1.7, z * 0.012 + 3.1) * 0.4;
  const k = d / 120;
  return Math.pow(k, 1.42) * 25 * (0.35 + n);
}

// projection of world (x,y,z) through camera -> [sx, sy, depth]
function proj(cam, x, y, z) {
  const dx = x - cam.camX, dz = z - cam.zg;
  const cs = Math.cos(cam.psi), sn = Math.sin(cam.psi);
  const xr = dx * cs - dz * sn;
  let zr = dx * sn + dz * cs;
  if (zr < 6) zr = 6;
  return [W / 2 + cam.f * xr / zr, cam.yh - cam.f * (y - cam.camH) / zr, zr];
}

const DZ = 40, NR = 92, DU = 40, NU = 34;
const rowX = new Float32Array(2 * NU + 1), rowY = new Float32Array(2 * NU + 1);
function drawTerrain(cam) {
  const z0 = Math.floor(cam.zg / DZ) * DZ;
  const n = 2 * NU + 1;
  const prevX = new Float32Array(n), prevY = new Float32Array(n);
  let havePrev = false, prevFade = 0;
  const flat = cam.mf <= 0.001;
  const zfar = NR * DZ;
  ctx.lineJoin = 'round';
  for (let i = NR; i >= 1; i--) {
    const z = z0 + i * DZ, rel = z - cam.zg;
    const rx = cam.road ? roadX(z) : 0;
    for (let j = 0; j < n; j++) {
      const u = (j - NU) * DU;
      const h = flat ? 0 : terrH(u, z) * cam.mf;
      const p = proj(cam, rx + u, h, z);
      rowX[j] = p[0]; rowY[j] = p[1];
    }
    const fade = Math.pow(c01(1 - rel / (cam.fadeFar || zfar)), cam.fadePow || 1.7);
    if (havePrev) {
      // occluding fill of the strip between previous (far) row and this (near) row
      if (!flat) {
        ctx.beginPath();
        ctx.moveTo(prevX[0], prevY[0]);
        for (let j = 1; j < n; j++) ctx.lineTo(prevX[j], prevY[j]);
        for (let j = n - 1; j >= 0; j--) ctx.lineTo(rowX[j], rowY[j]);
        ctx.closePath(); ctx.fillStyle = BGS; ctx.fill();
      }
      const a = clamp(prevFade * cam.gb, 0, 1);
      if (a > 0.004) {
        ctx.strokeStyle = rgba(RED, a);
        ctx.lineWidth = clamp(2.8 * Math.sqrt(380 / Math.max(rel, 1)), 1.0, 2.8);
        ctx.beginPath();
        ctx.moveTo(prevX[0], prevY[0]);
        for (let j = 1; j < n; j++) ctx.lineTo(prevX[j], prevY[j]);
        for (let j = 0; j < n; j++) { ctx.moveTo(prevX[j], prevY[j]); ctx.lineTo(rowX[j], rowY[j]); }
        ctx.stroke();
      }
    }
    prevX.set(rowX); prevY.set(rowY); prevFade = fade; havePrev = true;
  }
  // nearest row line
  ctx.strokeStyle = rgba(RED, clamp(prevFade * cam.gb, 0, 1)); ctx.lineWidth = 2.8;
  ctx.beginPath(); ctx.moveTo(prevX[0], prevY[0]); for (let j = 1; j < n; j++) ctx.lineTo(prevX[j], prevY[j]); ctx.stroke();
}

function drawLane(cam, alpha) {
  if (alpha <= 0) return;
  const z0 = Math.floor(cam.zg / 110) * 110;
  for (let i = 40; i >= 1; i--) {
    const z = z0 + i * 110, rel = z - cam.zg; if (rel < 20) continue;
    const za = z, zb = z + 46, rxa = roadX(za), rxb = roadX(zb);
    const a = proj(cam, rxa - 2, 0, za), b = proj(cam, rxa + 2, 0, za), c = proj(cam, rxb + 2, 0, zb), d = proj(cam, rxb - 2, 0, zb);
    const fa = Math.pow(c01(1 - rel / 4000), 2) * alpha * 0.7 * ss(40, 260, rel);
    ctx.fillStyle = rgba(YEL, fa);
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.lineTo(d[0], d[1]); ctx.closePath(); ctx.fill();
  }
}

// ------------------------------------------------------------------ stars (dim pixel dust in the sky)
const STARS = [];
(function () { const r = mulberry32(99); for (let i = 0; i < 130; i++) STARS.push({ x: r() * 2400 - 240, y: r() * 560 - 40, s: r() < 0.25 ? 3 : 2, c: r() < 0.6 ? BEI : YEL, a: 0.12 + 0.35 * r() * r(), ph: r() * 6.28, w: 0.6 + r() * 2 }); })();
function drawStars(t, shiftX, yh, alpha) {
  for (const s of STARS) {
    let x = ((s.x + shiftX) % 2400 + 2400) % 2400 - 240;
    const y = s.y; if (y > yh - 30) continue;
    const tw = 0.65 + 0.35 * Math.sin(s.ph + t * s.w * 2.2);
    const fadeH = ss(yh - 30, yh - 150, y);
    ctx.fillStyle = rgba(mulc(s.c, 0.9), s.a * tw * alpha * fadeH);
    ctx.fillRect(Math.round(x), Math.round(y), s.s, s.s);
  }
}

// ------------------------------------------------------------------ sun (stepped pixel disc, cut in the lower half)
function drawSun(cx, cy, R, cell, t, bright, white) {
  // soft glow – only around the sun
  const gR = R * (white ? 2.3 : 1.75);
  const g = ctx.createRadialGradient(cx, cy, R * 0.6, cx, cy, gR);
  const gc = white ? BEI : mixc(RED, YEL, 0.35);
  g.addColorStop(0, rgba(gc, white ? 0.42 : 0.2 + 0.16 * bright)); g.addColorStop(1, rgba(gc, 0));
  ctx.fillStyle = g; ctx.fillRect(cx - gR, cy - gR, gR * 2, gR * 2);
  const nr = Math.ceil(R / cell);
  const ph = (t * 0.55) % 1;
  for (let j = -nr; j < nr; j++) {
    const y0 = cy + j * cell, yc = y0 + cell / 2, dy = yc - cy;
    if (Math.abs(dy) > R) continue;
    const hw = Math.round(Math.sqrt(R * R - dy * dy) / cell) * cell;
    if (hw <= 0) continue;
    const v = dy / R;
    if (!white && v > 0.02) {                      // horizontal gaps that thicken towards the bottom
      const s = (v * 5.5 + ph) % 1;
      if (s < 0.08 + 0.45 * v) continue;
    }
    let col;
    if (white) col = mixc(BEI, HOT, 0.6);
    else {
      const q = Math.round(c01((dy + R) / (2 * R)) * 7) / 7;
      col = mixc(YEL, RED, q);
      col = mixc(col, mixc(YEL, BEI, 0.5), 0.38 * bright);
    }
    ctx.fillStyle = rgba(col);
    ctx.fillRect(Math.round(cx - hw), Math.round(y0), hw * 2, cell + 0.7);
  }
}

// ------------------------------------------------------------------ the car
function carWorld(t) { const z = zcAt(t) + carD(t); return { z, x: roadX(z) }; }
function drawCar(cam, t) {
  const alpha = 1 - ss(1.86, 1.95, t);
  if (alpha <= 0) return;
  const cw = carWorld(t);
  const p = proj(cam, cw.x, 0, cw.z);
  const s = cam.f / p[2];                       // px per world unit
  const tauCar = tAtZ(cw.z);
  const lean = 0.55 * bankAt(tauCar);
  const h = 0.6, slope = (roadX(cw.z + h * 10) - roadX(cw.z - h * 10)) / (h * 20);
  const rel = Math.atan(slope) - cam.psi;      // car heading relative to view

  ctx.save();

  if (t < T_CRT) {
    const fr = Math.floor(t * 60 + 1e-6);
    const pat = GRAIN[fr % 4];
    const r = mulberry32(fr * 7919 + 3);
    pat.setTransform(new DOMMatrix([1, 0, 0, 1, Math.floor(r() * 256), Math.floor(r() * 256)]));
    sctx.fillStyle = pat; sctx.fillRect(0, 0, W, H);
    sctx.drawImage(VIG, 0, 0);
  }
  if (t >= T_CRT) drawFinalDot(t);
}
function postCRT(t) {
  sctx.fillStyle = '#000'; sctx.fillRect(0, 0, W, H);
  const cy = 540;
  const a = (t - T_CRT) / 0.09;
  if (a < 1) {
    const k = ei2(a);
    const sy = lerp(1, 0.004, k), hh = Math.max(3, H * sy);
    const sx = lerp(1, 1.04, k);
    sctx.drawImage(SC, (W - W * sx) / 2, cy - hh / 2, W * sx, hh);
    sctx.globalCompositeOperation = 'screen';
    sctx.globalAlpha = 0.6 * k; sctx.drawImage(SC, (W - W * sx) / 2, cy - hh / 2, W * sx, hh); sctx.globalAlpha = 1;
    sctx.globalCompositeOperation = 'source-over';
    const g = sctx.createLinearGradient(0, cy - hh / 2 - 40, 0, cy + hh / 2 + 40);
    g.addColorStop(0, rgba(BEI, 0)); g.addColorStop(0.5, rgba(BEI, 0.3 * k * k)); g.addColorStop(1, rgba(BEI, 0));
    sctx.globalCompositeOperation = 'screen'; sctx.fillStyle = g; sctx.fillRect(0, cy - hh / 2 - 40, W, hh + 80); sctx.globalCompositeOperation = 'source-over';
    sctx.globalAlpha = 1 - k; sctx.drawImage(VIG, 0, 0); sctx.globalAlpha = 1;
  } else {
    const b = (t - (T_CRT + 0.09)) / 0.15;
    if (b < 1) {
      const wl = W * (1 - ei2(b)) + 4;
      const fade = 1 - 0.5 * b;
      sctx.globalCompositeOperation = 'screen';
      const g = sctx.createLinearGradient(0, cy - 26, 0, cy + 26);
      g.addColorStop(0, rgba(BEI, 0)); g.addColorStop(0.5, rgba(BEI, 0.35 * fade)); g.addColorStop(1, rgba(BEI, 0));
      sctx.fillStyle = g; sctx.fillRect(W / 2 - wl / 2 - 30, cy - 26, wl + 60, 52);
      sctx.globalCompositeOperation = 'source-over';
      sctx.fillStyle = rgba(HOT, 0.95 * fade); sctx.fillRect(W / 2 - wl / 2, cy - 2, wl, 4);
    } else if (b < 1.6) {
      const f = 1 - (b - 1) / 0.6;
      const g = sctx.createRadialGradient(W / 2, cy, 0, W / 2, cy, 40);
      g.addColorStop(0, rgba(BEI, 0.4 * f * f)); g.addColorStop(1, rgba(BEI, 0));
      sctx.fillStyle = g; sctx.fillRect(W / 2 - 40, cy - 40, 80, 80);
    }
  }
}
function drawFinalDot(t) {
  // the red period survives the CRT switch-off, slides to the centre, flashes and dies at 9.7 s
  const v = setViewReturn(T_CRT);
  const p0 = v.pos, s0 = v.size;
  const u = eio((t - (T_CRT + 0.1)) / 0.4);
  const x = lerp(p0[0], W / 2, u), y = lerp(p0[1], 540 + s0 / 2, u);
  let size = s0, glow = 1.2, alpha = 1;
  const tf = T_CRT + 0.5, td = T_CRT + 0.7;
  const fl = Math.exp(-Math.pow((t - tf) / 0.045, 2));
  size *= 1 + 0.45 * fl; glow += 1.6 * fl;
  if (t > tf && t < td) glow += 0.25 * Math.sin(Math.PI * (t - tf) / 0.2);
  if (t >= td) { const k = c01((t - td) / 0.05); size *= 1 - 0.85 * ei2(k); alpha = 1 - k; glow *= 1 - k; }
  if (alpha <= 0.001) {
    const k = c01((t - (td + 0.05)) / 0.04);
    if (k < 1) { const g = sctx.createRadialGradient(W / 2, 540, 0, W / 2, 540, 30); g.addColorStop(0, rgba(RED, 0.25 * (1 - k))); g.addColorStop(1, rgba(RED, 0)); sctx.fillStyle = g; sctx.fillRect(W / 2 - 30, 510, 60, 60); }
    return;
  }
  drawPen(sctx, { x, y, w: size, h: size, glow }, alpha);
}
function setViewReturn(t) {
  setView(t);
  const ps = penState(t);
  return { pos: [ps.x, ps.y], size: ps.w };
}

// ------------------------------------------------------------------ init derived values
(function () {
  const cam = camOpen(T_BOOM);
  SUNC.x = W / 2 - cam.f * Math.tan(cam.psi);
  SUNC.y = cam.yh - 0.5 * 250 + cam.bump;
  SUNC.r = 250 * 0.52;
})();

function draw(t) {
  t = clamp(+t || 0, 0, 10);
  drawScene(t);
  post(t);
}
window.renderFrame = function (t) {
  overlay.classList.add('hidden');
  draw(t);
};

// ------------------------------------------------------------------ playback
draw(0);
let playing = false;
function loop() {
  if (!playing) return;
  draw(audio.currentTime);
  if (audio.ended) { playing = false; overlay.classList.remove('hidden'); return; }
  requestAnimationFrame(loop);
}
overlay.querySelector('button').addEventListener('click', () => {
  overlay.classList.add('hidden');
  audio.currentTime = 0;
  const p = audio.play();
  playing = true;
  if (p && p.catch) p.catch(() => { playing = false; overlay.classList.remove('hidden'); });
  requestAnimationFrame(loop);
});
audio.addEventListener('ended', () => { playing = false; draw(10); overlay.classList.remove('hidden'); });
})();
</script>
</body>
