<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>娜乌斯嘉AI 频道片头</title>
<style>
  :root{--bg:#121419;--red:#FF4757;--yel:#F5C451;--wht:#ECE8E1}
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  #stage{display:block;width:min(100vw,177.7778vh);height:min(56.25vw,100vh);background:var(--bg)}
  #play{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,7,9,.55)}
  #play button{font:700 26px "Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;color:var(--wht);
    background:var(--bg);border:2px solid var(--red);padding:16px 42px;letter-spacing:.25em;cursor:pointer;
    box-shadow:6px 6px 0 #5C1626}
  #play button:hover{background:#1b1e25}
  #play.hide{display:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="stage" width="1920" height="1080"></canvas></div>
<div id="play"><button id="btn" type="button">▶ 播放</button></div>
<audio id="aud" src="music.wav" preload="auto"></audio>
<script>
'use strict';
/* =====================================================================
   娜乌斯嘉AI · 16 秒频道片头 —— Canvas 2D，所有状态只由 t 决定
   ===================================================================== */
const W = 1920, H = 1080;
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

/* ---------- math ---------- */
const PRE = 1 / 60;   // 重拍动作提前一帧起势，保证拍点那一帧上已经有可见变化
const PI = Math.PI, TAU = PI * 2, DEG = PI / 180;
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const eIOc = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const eOc = t => { t = clamp(t); return 1 - Math.pow(1 - t, 3); };
const eIc = t => { t = clamp(t); return t * t * t; };
const eIq = t => { t = clamp(t); return t * t; };
const eOq = t => { t = clamp(t); return 1 - (1 - t) * (1 - t); };
const eIOs = t => { t = clamp(t); return -(Math.cos(PI * t) - 1) / 2; };
const eOb = (t, s = 1.9) => { t = clamp(t); const c3 = s + 1; return 1 + c3 * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); };
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(a, b = 0, c = 0) {
  let h = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263) + Math.imul(c | 0, 1274126177)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1103515245); h ^= h >>> 16; h = Math.imul(h, 2246822519); h ^= h >>> 13;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return lerp(lerp(hash(xi, yi, 7), hash(xi + 1, yi, 7), u), lerp(hash(xi, yi + 1, 7), hash(xi + 1, yi + 1, 7), u), v);
}

/* ---------- palette ---------- */
const C_BG = [18, 20, 25], C_RED = [255, 71, 87], C_YEL = [245, 196, 81], C_WHT = [236, 232, 225];
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const shade = (c, k) => [c[0] * k, c[1] * k, c[2] * k];
const BG = rgba(C_BG);
const FACE_TOP = [235, 232, 224];          // 亮米白（< 纯白）
const FACE_BOT = [242, 200, 162];          // 浅杏色
const AI_TOP = C_YEL;                       // 暖黄
const AI_BOT = [249, 136, 84];             // 橙
const EXT1 = [150, 36, 48];                // 深红挤出
const EXT2 = [86, 20, 34];                 // 酒红挤出
const FLASH = [243, 240, 233];             // 闪光色（仍低于纯白）

/* =====================================================================
   1. 像素标题字形（16×16 网格，二值化后嵌入，逐格对齐）
   ===================================================================== */
const P = 10;               // 标题像素格 10px
const GLYPHS = [
  [ // 娜
    "................",
    "...#............",
    "...#..####.####.",
    "...#...#.#.#..#.",
    "..###..#.#.#..#.",
    ".#####.#.#.#.##.",
    "..#.######.#.#..",
    "..#.#..#.#.#.#..",
    "..#.#..#.#.#.##.",
    ".##.#..#.#.#..#.",
    ".####.####.#..#.",
    "..###..#.#.#..#.",
    "...##.##.#.####.",
    "..###.#..#.#....",
    ".##..##..#.#....",
    ".....#.###.#...."],
  [ // 乌
    "................",
    "......##........",
    "....#########...",
    "...##########...",
    "...##......##...",
    "...##......##...",
    "...##....####...",
    "...##...........",
    "...############.",
    "...############.",
    ".............##.",
    ".###########.##.",
    ".###########.##.",
    ".............##.",
    "..........####..",
    "..........###..."],
  [ // 斯
    "................",
    "..##..##.....##.",
    "..##..##.#####..",
    "##########......",
    "..##..##.##.....",
    "..######.##.....",
    "..##..##.######.",
    "..######.######.",
    "..##..##.##..##.",
    "..##..##.##..##.",
    "##########...##.",
    "##########...##.",
    "...#..##.##..##.",
    "..##...####..##.",
    ".##.....##...##.",
    ".............##."],
  [ // 嘉
    "................",
    ".......##.......",
    ".##############.",
    ".......##.......",
    "..############..",
    "................",
    "...##########...",
    "...##......##...",
    "...##########...",
    ".....##..##.....",
    "################",
    "...##...#####...",
    ".#######.##.##..",
    "...#..##.##.##..",
    ".###..##.#####..",
    "##...###.##.##.."],
  [ // A
    "..........",
    "..........",
    "...####...",
    "..######..",
    "..##..##..",
    ".###..###.",
    ".##....##.",
    ".##....##.",
    "##......##",
    "##......##",
    "##########",
    "##########",
    "##......##",
    "##......##",
    "##......##",
    "##......##"],
  [ // I
    "......",
    "......",
    "######",
    "######",
    "..##..",
    "..##..",
    "..##..",
    "..##..",
    "..##..",
    "..##..",
    "..##..",
    "..##..",
    "..##..",
    "..##..",
    "######",
    "######"]
];
const NG = GLYPHS.length;
const SPLIT_ROW = 8;   // 上下两段色分界
const glyph = [];      // {minC,maxC,w,gx, cells:[[r,c]], top}
(function layout() {
  let cursor = 0;
  const gaps = [6, 6, 6, 6, 2];
  for (let g = 0; g < NG; g++) {
    const rows = GLYPHS[g];
    let minC = 99, maxC = -1; const cells = [];
    rows.forEach((row, r) => { for (let c = 0; c < row.length; c++) if (row[c] === '#') { cells.push([r, c]); minC = Math.min(minC, c); maxC = Math.max(maxC, c); } });
    const w = maxC - minC + 1;
    const gx = cursor - minC;   // 字形列 c 的绝对格坐标 = gx + c
    glyph.push({ minC, maxC, w, gx, cells, cols: rows[0].length });
    cursor += w + (g < NG - 1 ? gaps[g] : 0);
  }
  // 句点：I 右侧空 2 格，3×3 格，落在基线
  glyph.periodCol = cursor + 2;
  glyph.totalCells = cursor + 2 + 3;
})();
const TITLE_W = glyph.totalCells * P;
const X0 = Math.round(960 - (glyph.totalCells + 1) * P / 2);
const Y0 = 385;
const TCX = 960, TCY = 465;            // 标题中心（镜头推拉中心）
for (const G of glyph) {
  G.x = X0 + (G.gx + G.minC) * P;       // 精灵左上（像素）
  G.cx = X0 + (G.gx + (G.minC + G.maxC + 1) / 2) * P;
  const mid = (G.minC + G.maxC) / 2;
  let top = 99;
  for (const [r, c] of G.cells) if (Math.abs(c - mid) <= 3.5) top = Math.min(top, r);
  G.topY = Y0 + top * P;
}
const PERIOD_X = X0 + glyph.periodCol * P, PERIOD_Y = Y0 + 13 * P; // 3×3 格
const PERIOD_CX = PERIOD_X + 15, PERIOD_CY = PERIOD_Y + 15;

/* 字形精灵 */
function glyphSprite(g, topC, botC) {
  const G = glyph[g]; const c = mk((G.w) * P, 16 * P); const x = c.getContext('2d');
  for (const [r, cc] of G.cells) {
    x.fillStyle = rgba(r < SPLIT_ROW ? topC : botC);
    x.fillRect((cc - G.minC) * P, r * P, P, P);
  }
  return c;
}
function glyphSil(g, col) { return glyphSprite(g, col, col); }
const SPR = glyph.map((G, g) => ({
  face: glyphSprite(g, FACE_TOP, FACE_BOT),
  faceAI: g >= 4 ? glyphSprite(g, AI_TOP, AI_BOT) : null,
  ext1: glyphSil(g, EXT1), ext2: glyphSil(g, EXT2),
  flash: glyphSil(g, FLASH), white: glyphSil(g, [255, 255, 255])
}));

/* =====================================================================
   2. 开场：道路、相机、地形
   ===================================================================== */
function bump(t, c, hw, a) { const x = (t - c) / hw; return Math.abs(x) < 1 ? a * Math.pow(Math.cos(x * PI / 2), 2) : 0; }
function HEAD(t) { // 道路朝向（弧度），按相机经过的时间定义：弯越来越急，3.42 秒后笔直
  return DEG * (bump(t, 0.62, 0.52, 10) + bump(t, 1.42, 0.44, -13) + bump(t, 2.12, 0.36, 15)
    + bump(t, 2.72, 0.3, -17) + bump(t, 3.18, 0.24, 9));
}
function vel(t) { // 前进速度（单位/秒）
  const burst = 85 * Math.exp(-Math.pow((t - 0.1) / 0.2, 2));          // 0–0.5 前冲钩子
  const ramp = Math.pow(clamp((t - 0.55) / 3.05), 2.1);
  const fast = 22 + 98 * ramp;                                          // 缓入加速
  const d = sstep(3.56, 3.8, t);
  const slow = 15 - 9 * sstep(3.85, 5.0, t);
  return fast * (1 - d) + slow * d + burst;
}
function suckV(t) { // 3.62–3.98 网格线被太阳吸走（向太阳方向流动）
  if (t < 3.6) return 0;
  if (t < 3.983) return 118 * eIq((t - 3.6) / 0.383);
  return 118 * Math.exp(-(t - 3.983) / 0.06);
}
const DTT = 0.001, NT = 16600;
const zTab = new Float64Array(NT + 2), sTab = new Float64Array(NT + 2), xTab = new Float64Array(NT + 2);
for (let i = 1; i <= NT + 1; i++) {
  const t = (i - 0.5) * DTT, v = vel(t);
  zTab[i] = zTab[i - 1] + v * DTT; sTab[i] = sTab[i - 1] + suckV(t) * DTT;
  xTab[i] = xTab[i - 1] + Math.tan(HEAD(t)) * v * DTT;
}
function tab(a, t) { const f = clamp(t, 0, NT * DTT) / DTT; const i = Math.min(NT, Math.floor(f)); return a[i] + (a[i + 1] - a[i]) * (f - i); }
function roadX(z) {
  if (z <= 0) return 0; if (z >= zTab[NT]) return xTab[NT];
  let lo = 0, hi = NT;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (zTab[m] < z) lo = m; else hi = m; }
  const u = (z - zTab[lo]) / (zTab[hi] - zTab[lo]);
  return xTab[lo] + (xTab[hi] - xTab[lo]) * u;
}
const DZ = 5, FAR = 440;
const COLS = (function () { const a = [0]; let x = 0, d = 4; for (let i = 0; i < 15; i++) { x += 4; a.push(x); } for (let i = 0; i < 17; i++) { d *= 1.14; x += d; a.push(x); } const r = []; for (let i = a.length - 1; i > 0; i--) r.push(-a[i]); return r.concat(a); })();
const NC = COLS.length;
const VAL_L = COLS.findIndex(x => x > -6.5) , VAL_R = COLS.findIndex(x => x >= 6.5) - 1;
function terrH(xl, zw) {
  const d = Math.abs(xl) - 6.5; if (d <= 0) return 0;
  const base = 42 * (1 - Math.exp(-d / 55)) * sstep(0, 22, d);
  const n = vnoise(xl * 0.05 + (xl < 0 ? 37 : 0), zw * 0.028) * 0.62 + vnoise(xl * 0.13 + 11, zw * 0.075) * 0.38;
  return base * (0.35 + 1.15 * n);
}
const SUN_EL = 0.135;

/* 相机：开场在路上飞，4 秒后过渡成标题段的缓慢地面镜头 */
function camT(t) { // 标题段（世界层）镜头
  let zoom = 1;
  zoom += 0.007 * (eOb((t - 6.5 + PRE) / 0.3) + eOb((t - 7.0 + PRE) / 0.3) + eOb((t - 7.5 + PRE) / 0.3));
  zoom += 0.03 * eIOs((t - 8) / 7);
  const sw = sstep(8.3, 9.4, t);
  const yaw = DEG * 1.6 * Math.sin(TAU * (t - 8.3) / 7.4) * sw;
  const roll = DEG * 0.22 * Math.sin(TAU * (t - 8.0) / 5.2 + 0.6) * sw;
  let px = -yaw * 420, py = 0;
  if (t >= 8 && t < 8.42) {                         // 故障抖动
    const n = Math.floor(t * 30), I = glitchI(t);
    px += (hash(n, 3) - .5) * 26 * I; py += (hash(n, 4) - .5) * 14 * I;
  }
  return { zoom, yaw, roll, px, py };
}
function gridCam(t) {
  const z = tab(zTab, t), sh = tab(sTab, t);
  const bumpK = clamp(vel(t) / 100, 0.2, 1.2) * (1 - sstep(3.6, 4.2, t));
  let cy = 2.35 + 0.07 * bumpK * (vnoise(t * 9, 3.1) - .5) + 0.05 * bumpK * Math.sin(t * 31);
  let pitch = -0.02 + 0.006 * bumpK * (vnoise(t * 7, 8.3) - .5);
  let yaw = HEAD(t + 0.06);
  const dh = (HEAD(t + 0.01) - HEAD(t - 0.01)) / 0.02 / DEG;  // 度/秒
  let roll = -7.2 * DEG * Math.tanh(dh / 52);                  // 画面朝弯道内侧倾斜
  let f = 900 - 150 * Math.exp(-Math.pow((t - 0.1) / 0.24, 2)) + 75 * sstep(3.5, 3.983, t);
  let hm = 1, br = 1;
  const k = eIOc((t - 4.03) / 0.95);               // 4 秒后：地形下沉、镜头上抬
  if (t > 4.0) {
    const ct = camT(t);
    hm = lerp(1, 0.26, k);
    br = lerp(1, 0.4, eIOc((t - 4.05) / 1.1));
    pitch = lerp(pitch, Math.atan(60 / 900), k);
    cy = lerp(cy, 3.1, k);
    f = lerp(f, 900, k) * ct.zoom;
    yaw = lerp(yaw, ct.yaw * 0.55, k);
    roll = lerp(roll, ct.roll, k);
  }
  return { z, cy, x: roadX(z), sh, yaw, pitch, roll, f, hm, br };
}

/* 太阳精灵：像素台阶边缘，上黄下红，下半部被横向空隙切开 */
function sunGap(j, R) { // j: 相对中心的行（向下为正）
  const gaps = [[2, 1], [6, 2], [10, 2], [14, 3], [18, 3], [22, 4], [27, 4], [32, 5]];
  for (const [s, n] of gaps) { const ss = Math.round(s * R / 28); if (j >= ss && j < ss + Math.max(1, Math.round(n * R / 28))) return true; }
  return false;
}
function buildSun(R, cs, lift, gapLine) {
  const D = R * 2, c = mk(D * cs, D * cs), x = c.getContext('2d');
  for (let j = -R; j < R; j++) {
    const tr = (j + R) / D;
    const q = Math.round(sstep(0.12, 0.92, tr) * 7) / 7;   // 8 级色带
    let col = mixc(C_YEL, C_RED, q);
    col = mixc(col, [250, 240, 214], lift);
    for (let i = -R; i < R; i++) {
      if ((i + .5) * (i + .5) + (j + .5) * (j + .5) > R * R) continue;
      if (j >= 0 && sunGap(j, R)) continue;
      x.fillStyle = rgba(col);
      x.fillRect((i + R) * cs, (j + R) * cs, cs - gapLine, cs - gapLine);
    }
  }
  return c;
}
const SUN_R = 28, SUN_CS = 8;
const SUN = buildSun(SUN_R, SUN_CS, 0, 0), SUN_B = buildSun(SUN_R, SUN_CS, 0.55, 0);
const OX_R = 15, OX_CS = 12;
const SUN_OX = buildSun(OX_R, OX_CS, 0.88, 1);     // 过曝像素太阳（格缝可见）

function sunScreen(gc) { // 太阳中心（未旋转的相机屏幕坐标）
  const sx = 960 - gc.f * Math.tan(gc.yaw);
  const sy = 540 - gc.f * Math.tan(SUN_EL - gc.pitch);
  return [sx, sy];
}
const SUN_AT4 = sunScreen(gridCam(4.0));

/* 星点 */
const STARS = (function () { const r = mulberry(91), a = []; for (let i = 0; i < 90; i++) a.push([r() * 2400 - 240, r() * 470 + 20, r() < .2 ? 3 : 2, r() * TAU, 0.6 + r() * 1.8, 0.12 + r() * 0.28]); return a; })();

/* =====================================================================
   3. 粒子系统（约 3000 颗）
   ===================================================================== */
const NP = 3000;
const S_UNIT = [4.70, 4.88, 5.06, 5.24, 5.42];       // 每个字的出发窗口起点
const UNIT_OF = [0, 1, 2, 3, 4, 4];
const VX = 960, VY = 468, VA = 690, VB = 112;          // 吸积盘
const unitCells = [[], [], [], [], []];
glyph.forEach((G, g) => { for (const [r, c] of G.cells) unitCells[UNIT_OF[g]].push({ g, r, c, x: X0 + (G.gx + c) * P, y: Y0 + r * P, land: 99 }); });
const UNIT_CX = unitCells.map(cs => cs.reduce((s, c) => s + c.x, 0) / cs.length + P / 2);
const PART = [];
const CPL = S_UNIT.map(s => s + 1.05);                 // 每个字成形（变实心）时刻
(function initParticles() {
  const rnd = mulberry(20261027);
  // 过曝太阳的子块
  const [scx, scy] = SUN_AT4; const srcs = [];
  for (let j = -OX_R; j < OX_R; j++) for (let i = -OX_R; i < OX_R; i++) {
    if ((i + .5) * (i + .5) + (j + .5) * (j + .5) > OX_R * OX_R) continue;
    if (j >= 0 && sunGap(j, OX_R)) continue;
    for (let b = 0; b < 2; b++) for (let a = 0; a < 2; a++) srcs.push([scx + (i * OX_CS) + a * 6 + 3, scy + (j * OX_CS) + b * 6 + 3, j]);
  }
  while (srcs.length < NP) { const s = srcs[Math.floor(rnd() * srcs.length)]; srcs.push([s[0] + (rnd() - .5) * 8, s[1] + (rnd() - .5) * 8, s[2]]); }
  // 分配到各字（按格数比例）
  const total = unitCells.reduce((s, u) => s + u.length, 0);
  const counts = unitCells.map(u => Math.round(NP * u.length / total)); counts[4] += NP - counts.reduce((a, b) => a + b, 0);
  const order = []; for (let k = 0; k < 5; k++) { const cells = unitCells[k].slice(); for (let i = cells.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [cells[i], cells[j]] = [cells[j], cells[i]]; } for (let n = 0; n < counts[k]; n++) order.push([k, cells[n % cells.length], n, counts[k]]); }
  for (let i = srcs.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [srcs[i], srcs[j]] = [srcs[j], srcs[i]]; }
  for (let i = 0; i < NP; i++) {
    const [x0, y0, row] = srcs[i]; const [k, cell, n, cnt] = order[i];
    let ci = row < -4 ? 1 : row > 3 ? 0 : (rnd() < .5 ? 0 : 1);
    if (rnd() < .26) ci = 2;
    const dep = clamp(Math.exp((rnd() - .5) * 1.5 + (rnd() - .5) * .6), 0.4, 2.6);
    let dx = x0 - scx, dy = y0 - scy; const dl = Math.hypot(dx, dy) || 1; dx /= dl; dy /= dl;
    const ang = Math.atan2(dy, dx) + (rnd() - .5) * 0.5; dx = Math.cos(ang); dy = Math.sin(ang);
    const v0 = (420 + 1500 * Math.pow(rnd(), 1.6)) * Math.pow(dep, 0.9);
    const sz = [6, 7, 8, 9, 10][Math.floor(rnd() * 5)];
    const R = 0.5 + 0.55 * Math.sqrt(rnd());
    const om = 1.25 / Math.pow(R, 1.4);
    // 出发时间：0–0.6 秒错开；每个字最后一颗正好 S+0.6 出发、0.45 秒到达
    const last = (n === cnt - 1);

function drawParticles(t, cam) {
  const buckets = [];
  for (let i = 0; i < 3 * NB; i++) buckets.push([]);
  const dofList = [];
  const hot = t < 4.1;
  for (let i = 0; i < NP; i++) {
    const p = PART[i];

    if (x < -80 || x > W + 80 || y < -80 || y > H + 80) continue;
    const q2 = pPos(p, t - 0.03) || q;
    // 亮度：远小暗 / 近大
    let b = clamp(0.3 + 0.7 * dep, 0.25, 1);
    let ci = p.ci;
    if (hot && hash(i, 9) < 0.7) ci = 2;

    if (near) { const fade = 1 - eIOc((t - p.bl) / 0.45); if (fade > 0.02) dofList.push(x, y, s0, ci, q2[0], q2[1], fade); continue; }
    const bi = Math.round(b * (NB - 1));

  }
  // 拖尾（运动模糊）
  for (let k = 0; k < buckets.length; k++) {
    const L = buckets[k]; if (!L.length) continue;
    wx.fillStyle = PTRAIL[Math.floor(k / NB)][k % NB];
    wx.beginPath();
    for (let j = 0; j < L.length; j += 5) {
      const x = L[j], y = L[j + 1], s = L[j + 2], tx2 = L[j + 3], ty2 = L[j + 4];
      let dx = x - tx2, dy = y - ty2; const d = Math.hypot(dx, dy);
      if (d < 2) continue;
      const lim = Math.min(1, Math.max(5 * s, 26) / d);
      const ex = x - dx * lim, ey = y - dy * lim;
      const nx = -dy / d * s * 0.42, ny = dx / d * s * 0.42;
      wx.moveTo(x + nx, y + ny); wx.lineTo(x - nx, y - ny); wx.lineTo(ex - nx * 0.55, ey - ny * 0.55); wx.lineTo(ex + nx * 0.55, ey + ny * 0.55); wx.closePath();
    }
    wx.fill();
  }

  for (let k = 0; k < buckets.length; k++) {
    const L = buckets[k]; if (!L.length) continue;
    wx.fillStyle = PSTYLE[Math.floor(k / NB)][k % NB];
    wx.beginPath();
    for (let j = 0; j < L.length; j += 5) { const s = Math.max(2, Math.round(L[j + 2])); wx.rect(Math.round(L[j] - s / 2), Math.round(L[j + 1] - s / 2), s, s); }
    wx.fill();
  }
  // 粒子泛光（淡）
  if (t < 4.6) {
    const a = 0.5 * (1 - sstep(4.1, 4.6, t));
    g1x.globalAlpha = a;
    for (let k = 0; k < buckets.length; k++) { const L = buckets[k]; if (!L.length || k % NB < NB - 2) continue; g1x.fillStyle = PSTYLE[Math.floor(k / NB)][NB - 1]; g1x.beginPath(); for (let j = 0; j < L.length; j += 10) g1x.rect(L[j] / 4 - 1, L[j + 1] / 4 - 1, 2.5, 2.5); g1x.fill(); }
    g1x.globalAlpha = 1;
  }
  // 近处的大块：景深虚化
  dofx.clearRect(0, 0, 480, 270);
  for (let j = 0; j < dofList.length; j += 7) {
    const x = dofList[j], y = dofList[j + 1], s = dofList[j + 2], ci = dofList[j + 3], fa = dofList[j + 6];

      dofx.fillRect((px - s / 2) / 4, (py - s / 2) / 4, s / 4, s / 4);
    }

}

/* 世界层 → 屏幕（推镜 + 轻微三维摇摆，竖条透视） */
function blitWorld(dc, cam, y0, y1) {
  const xa0 = y0 > 0 ? 256 : 0, xb0 = y0 > 0 ? W - 256 : W;
  dc.save();
  dc.translate(960, 540); dc.rotate(cam.roll); dc.translate(-960, -540);
  const Cx = TCX, Cy = TCY, z = cam.zoom;
  if (Math.abs(cam.yaw) < 1e-6 && Math.abs(z - 1) < 1e-9) {
    dc.drawImage(world, xa0, y0, xb0 - xa0, y1 - y0, xa0 + Math.round(cam.px), y0 + Math.round(cam.py), xb0 - xa0, y1 - y0);
  } else {
    const N = 24, sw = (xb0 - xa0) / N, sy = Math.sin(cam.yaw), cyw = Math.cos(cam.yaw), F = 1500;
    const X = x => { const d = x - Cx; return Cx + cam.px + z * d * cyw * F / (F + d * sy); };
    for (let i = 0; i < N; i++) {
      const xa = xa0 + i * sw, xb = Math.min(xb0, xa + sw + 1);

   ===================================================================== */
function blurGlow() {
  g1bx.clearRect(0, 0, 480, 270); g1bx.filter = 'blur(2.2px)'; g1bx.drawImage(g1, 0, 0); g1bx.filter = 'none';
  g2bx.clearRect(0, 0, 240, 135); g2bx.filter = 'blur(3.5px)'; g2bx.drawImage(g2, 0, 0); g2bx.filter = 'none';
  g1bx.globalCompositeOperation = 'lighter'; g1bx.drawImage(g2b, 0, 0, 480, 270); g1bx.globalCompositeOperation = 'source-over';
}

const T_BLACK = 15.84;
function draw(t) {
  t = clamp(t, 0, 16);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  if (t >= T_BLACK) { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); return; }
  const fi = Math.round(t * 60);
  // 发光层清空
  g1x.setTransform(1, 0, 0, 1, 0, 0); g1x.globalAlpha = 1; g1x.globalCompositeOperation = 'source-over';
  g1x.fillStyle = '#000'; g1x.fillRect(0, 0, 480, 270);
  g2x.setTransform(1, 0, 0, 1, 0, 0); g2x.globalAlpha = 1; g2x.fillStyle = '#000'; g2x.fillRect(0, 0, 240, 135);
  // 背景
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  const crt = t >= 15.0;
  const gc = gridCam(t);
  drawLand(t, gc);
  if (t >= 4.0 && t < 4.05) drawOverexposed(t);
  // 世界层
  const hasWorld = t >= 4.0;
  const cam = camT(t);
  if (hasWorld) drawWorld(t, cam, crt);

  // 泛光（在锐利元素之后面）
  blurGlow();
  ctx.globalCompositeOperation = 'lighter';
  ctx.drawImage(g1b, 0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';
  if (t >= 4.0 && t < 4.05) { // 过曝的像素太阳 + 里面那颗红色主角
    drawOverexposed.body = true; drawOverexposed(t); drawOverexposed.body = false;
    drawBlock(ctx, hero(t));
  }
  // 世界层合成
  const y0 = t < 6.6 ? 0 : 40, y1 = t < 6.6 ? H : 780;
  const gI = glitchI(t);
  if (hasWorld) {
    if (gI > 0) glitchComposite(t, cam, y0, y1, gI);
    else blitWorld(ctx, cam, y0, y1);
  }
  // 近景虚化粒子
  if (t >= 4.05 && t < 4.9 && drawParticles.dofCount) {
    dofbx.clearRect(0, 0, 480, 270); dofbx.filter = 'blur(2.2px)'; dofbx.drawImage(dof, 0, 0); dofbx.filter = 'none';
    ctx.globalAlpha = 0.95; ctx.drawImage(dofb, 0, 0, W, H); ctx.globalAlpha = 1;
  }
  // 扫描线（8 秒后保留很淡、缓慢下移的一层）
  if (t >= 8.0 && !crt) {
    const k = gI > 0 ? 1 : 0.55 * sstep(8.35, 8.7, t) + 0.0;
    if (gI > 0) { ctx.globalAlpha = 0.7 * gI + 0.2; ctx.drawImage(SCAN2, 0, -((fi * 1) % 3)); ctx.globalAlpha = 1; }
    else {
      ctx.globalAlpha = k; const off = ((t - 8) * 7) % 4; ctx.drawImage(SCAN, 0, off - 4); ctx.globalAlpha = 1;
      // 缓慢下移的暗带
      const by = ((t - 8) * 140) % (H + 400) - 200;
      const gr = ctx.createLinearGradient(0, by - 140, 0, by + 140);
      gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(0.5, `rgba(0,0,0,${0.07 * k})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gr; ctx.fillRect(0, by - 140, W, 280);
    }
  }
  if (crt) crtOff(t, cam);
  // 颗粒 + 暗角
  if (t < 15.75) {
    ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = 0.16;
    const pat = GRAIN[fi % 4]; const ox = Math.floor(hash(fi, 1) * 256), oy = Math.floor(hash(fi, 2) * 256);
    ctx.translate(-ox, -oy); ctx.fillStyle = pat; ctx.fillRect(ox, oy, W, H); ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    ctx.drawImage(VIG, 0, 0);
  }
}

function glitchComposite(t, cam, y0, y1, I) {
  const n = Math.floor(t * 30); // 每 2 帧换一次切片
  // 世界层到屏幕
  const RX0 = 180, RX1 = W - 180, RY0 = 20, RY1 = 800, RW = RX1 - RX0, RH = RY1 - RY0;   // 世界层内容所在区域
  wsx.setTransform(1, 0, 0, 1, 0, 0); wsx.clearRect(RX0, RY0, RW, RH);
  blitWorld(wsx, cam, y0, y1);
  // 红 / 黄两层剪影（只处理有内容的区域）
  for (const [c, col] of [[trx, 'rgb(255,71,87)'], [tyx, 'rgb(245,196,81)']]) {
    c.globalCompositeOperation = 'source-over'; c.clearRect(RX0, RY0, RW, RH); c.drawImage(wS, RX0, RY0, RW, RH, RX0, RY0, RW, RH);
    c.globalCompositeOperation = 'source-in'; c.fillStyle = col; c.fillRect(RX0, RY0, RW, RH); c.globalCompositeOperation = 'source-over';
  }
  tx.clearRect(0, 0, W, H); tx.drawImage(cv, 0, 0);   // 背景
  const split = Math.round(18 * I * (0.75 + 0.25 * hash(n, 5)));
  const ns = 6 + Math.floor(hash(n, 6) * 5);
  // 切片边界
  const cuts = [0]; for (let i = 1; i < ns; i++) { const h = hash(n, 10 + i); cuts.push(i % 3 ? 0.33 + 0.25 * h : h); } cuts.push(1);   // 多数切口落在标题带上
  cuts.sort((a, b) => a - b);
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < ns; i++) {
    const ya = Math.round(cuts[i] * H), yb = Math.round(cuts[i + 1] * H), hh = yb - ya; if (hh < 1) continue;
    const r = hash(n, 40 + i);
    const dx = Math.round((r < 0.3 ? 0 : (hash(n, 60 + i) - .5) * 2) * 90 * I);
    const sgn = hash(n, 80 + i) < .5 ? -1 : 1;
    ctx.drawImage(tmp, 0, ya, W, hh, dx, ya, W, hh);
    const wa = Math.max(ya, RY0), wb = Math.min(yb, RY1);
    if (wb > wa) {
      ctx.globalAlpha = 0.9; ctx.drawImage(tintR, RX0, wa, RW, wb - wa, RX0 + dx - split * sgn, wa, RW, wb - wa);
      ctx.drawImage(tintY, RX0, wa, RW, wb - wa, RX0 + dx + split * sgn, wa, RW, wb - wa); ctx.globalAlpha = 1;
      ctx.drawImage(wS, RX0, wa, RW, wb - wa, RX0 + dx, wa, RW, wb - wa);
    }
  }
}

function crtOff(t, cam) {
  // 先把当前画面（不含句点）收成一条发光横线，再横向收缩
  tx.clearRect(0, 0, W, H); tx.drawImage(cv, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const a = (t - 15.0 + PRE) / (0.065 + PRE), b = (t - 15.065) / 0.085;
  if (a < 1) {
    const sy = Math.max(0.004, 1 - eIc(a) * 0.996), sx = 1 + 0.03 * eIc(a);
    ctx.setTransform(sx, 0, 0, sy, 960 * (1 - sx), 540 * (1 - sy));
    ctx.drawImage(tmp, 0, 0);
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = eIc(a) * 0.9; ctx.drawImage(tmp, 0, 0); ctx.drawImage(tmp, 0, 0);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; ctx.setTransform(1, 0, 0, 1, 0, 0);
    const lh = Math.max(3, 1080 * sy);
    const gl = eIc(a);
    const gr = ctx.createLinearGradient(0, 540 - lh / 2 - 40, 0, 540 + lh / 2 + 40);
    gr.addColorStop(0, 'rgba(255,71,87,0)'); gr.addColorStop(0.5, `rgba(240,236,228,${0.9 * gl})`); gr.addColorStop(1, 'rgba(255,71,87,0)');
    ctx.fillStyle = gr; ctx.fillRect(0, 540 - lh / 2 - 40, W, lh + 80);
  } else if (b < 1) {
    const w = 1920 * (1 - eIc(b)) * 1.03;
    const gr = ctx.createLinearGradient(0, 520, 0, 560);
    gr.addColorStop(0, 'rgba(255,71,87,0)'); gr.addColorStop(0.42, 'rgba(255,90,100,0.55)'); gr.addColorStop(0.5, 'rgba(242,238,230,1)'); gr.addColorStop(0.58, 'rgba(255,90,100,0.55)'); gr.addColorStop(1, 'rgba(255,71,87,0)');
    ctx.fillStyle = gr; ctx.fillRect(960 - w / 2, 520, w, 40);
    ctx.fillStyle = 'rgba(242,238,230,1)'; ctx.fillRect(960 - w / 2, 538, w, 4);
  } else {
    const c = 1 - clamp((t - 15.15) / 0.09);
    if (c > 0) { const s = 6 * c + 2; ctx.fillStyle = `rgba(242,238,230,${c})`; ctx.fillRect(960 - s, 540 - s / 2, 2 * s, s); }
  }
  // 句点：留在原位 → 15.1–15.5 滑到正中央 → 闪一下 → 15.7 熄灭
  const cam15 = camT(15.0);
  const px0 = TCX + cam15.px + cam15.zoom * (PERIOD_CX - TCX), py0 = TCY + cam15.py + cam15.zoom * (PERIOD_CY + titleLift(15) - TCY);
  const u = eIOc((t - 15.1) / 0.4);
  let x = lerp(px0, 960, u), y = lerp(py0, 540, u) - Math.sin(u * PI) * 18;
  let s = 30 * cam15.zoom;
  const flash = Math.exp(-Math.pow((t - 15.52) / 0.05, 2));
  let alive = t < 15.7 - PRE ? 1 : 1 - clamp((t - 15.7 + PRE) / 0.06);
  s *= (1 + 0.25 * flash) * (t < 15.7 - PRE ? 1 : lerp(1, 0.2, clamp((t - 15.7 + PRE) / 0.06)));
  const glow = (0.5 + 1.6 * flash + 0.25 * Math.sin(t * 30) * sstep(15.55, 15.6, t)) * alive + (t >= 15.7 ? 0.8 * Math.exp(-(t - 15.7) / 0.05) : 0);
  // 光晕
  const gr2 = ctx.createRadialGradient(x, y, 0, x, y, s * 2.4);
  gr2.addColorStop(0, `rgba(255,71,87,${clamp(0.55 * glow)})`); gr2.addColorStop(1, 'rgba(255,71,87,0)');
  ctx.fillStyle = gr2; ctx.fillRect(x - s * 2.6, y - s * 2.6, s * 5.2, s * 5.2);
  if (alive > 0) {
    drawBlock(ctx, { x, y, w: s, h: s, rot: 0 }, mixc(C_RED, [255, 200, 205], flash * 0.6));
  }
}

/* =====================================================================
   9. 对外接口
   ===================================================================== */
const playEl = document.getElementById('play');
const aud = document.getElementById('aud');
window.renderFrame = function (t) { playEl.classList.add('hide'); draw(t); };
let playing = false;
document.getElementById('btn').addEventListener('click', () => {
  playEl.classList.add('hide');
  aud.currentTime = 0; aud.play(); playing = true;
  const tick = () => { draw(aud.currentTime); if (!aud.ended && playing) requestAnimationFrame(tick); else { draw(16); playing = false; setTimeout(() => playEl.classList.remove('hide'), 600); } };
  requestAnimationFrame(tick);
});
draw(0);
</script>
