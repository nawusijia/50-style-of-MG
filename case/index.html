<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>娜乌斯嘉AI 片头</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  #stage{display:block;width:min(100vw,177.7778vh);height:min(56.25vw,100vh);background:#121419}
  #play{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);z-index:2}
  #play button{font:700 30px "Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;color:#ECE8E1;background:#121419;
    border:3px solid #FF4757;padding:18px 48px;cursor:pointer;letter-spacing:2px;box-shadow:6px 6px 0 #8a2733}
  #play button:hover{background:#1b1e25}
</style>
</head>
<body>
<div id="wrap"><canvas id="stage" width="1920" height="1080"></canvas></div>
<div id="play"><button id="btn">▶ 播放</button></div>
<audio id="au" src="music.wav" preload="auto"></audio>
<script>
'use strict';
/* ==========================================================================
   娜乌斯嘉AI · 16s channel ident — Canvas 2D, every pixel is a pure function of t
   ========================================================================== */
const W = 1920, H = 1080, FPS = 60, F1 = 1 / 60;   // F1: beat actions show on the beat frame itself
const cv = document.getElementById('stage');
const X = cv.getContext('2d');
const FONT = '"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif';

/* ---------- palette (only these four + their light/dark variations) ---------- */
const BGc = [18, 20, 25], REDc = [255, 71, 87], YELc = [245, 196, 81], CREc = [236, 232, 225];
const FACEc = [235, 232, 224];                 // title face: just under pure white
const DREDc = [140, 40, 52];                   // dark red (red darkened toward bg)
const BG = '#121419';

/* ---------- math helpers ---------- */
const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sm = t => { t = clamp(t); return t * t * (3 - 2 * t); };
const eOutC = t => { t = clamp(t); return 1 - (1 - t) ** 3; };
const eOutQ = t => { t = clamp(t); return 1 - (1 - t) ** 2; };
const eInC = t => { t = clamp(t); return t * t * t; };
const eInQ = t => { t = clamp(t); return t * t; };
const eIOC = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2; };
const eIOS = t => { t = clamp(t); return -(Math.cos(Math.PI * t) - 1) / 2; };
const eOutBack = (t, s = 1.70158) => { t = clamp(t); const c3 = s + 1; return 1 + c3 * (t - 1) ** 3 + s * (t - 1) ** 2; };
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const css = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${clamp(a).toFixed(4)})`;
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(a, b = 0, c = 0) {
  let h = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263) + Math.imul(c | 0, 1274126177)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1103515245); h ^= h >>> 16; h = Math.imul(h, 2246822519); h ^= h >>> 13;
  return (h >>> 0) / 4294967296;
}
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

/* ---------- value-noise terrain ---------- */
function vnoise(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
  const a = hash(xi, zi, 7), b = hash(xi + 1, zi, 7), c = hash(xi, zi + 1, 7), d = hash(xi + 1, zi + 1, 7);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
function fbm(x, z) { return vnoise(x, z) * .66 + vnoise(x * 2.07 + 5.3, z * 2.07 + 1.7) * .26 + vnoise(x * 4.3 + 9.1, z * 4.3 + 3.3) * .08; }
function terrainH(x, z) {
  const ax = Math.abs(x), v = Math.max(0, ax - 3.6);
  if (v <= 0) return 0;
  return Math.pow(v / 6, 1.5) * 3.3 * (0.3 + 1.15 * fbm(x * 0.12, z * 0.1));
}

/* ==========================================================================
   Pixel text: draw small, binarize, then use cells as crisp integer squares
   ========================================================================== */
function textMask(str, E, weight) {
  const pad = 4, cw = Math.ceil(E * str.length * 1.15) + pad * 2, ch = Math.ceil(E * 1.6);
  const o = mk(cw, ch), g = o.getContext('2d');
  g.font = `${weight} ${E}px ${FONT}`; g.fillStyle = '#fff'; g.textBaseline = 'alphabetic';
  const base = Math.round(E * 1.15);
  g.fillText(str, pad, base);
  const d = g.getImageData(0, 0, cw, ch).data, m = new Uint8Array(cw * ch);
  for (let i = 0; i < cw * ch; i++) m[i] = d[i * 4 + 3] >= 128 ? 1 : 0;   // binarize: no half-transparent fringe
  const bounds = [];
  for (let i = 0; i <= str.length; i++) bounds.push(pad + g.measureText(str.slice(0, i)).width);
  return { m, cw, ch, bounds, base, pad };
}
function cellsToPath(cells, ox, oy, c) {         // merge horizontal runs -> fewer rects
  const rows = new Map();
  for (const [q, r] of cells) { if (!rows.has(r)) rows.set(r, []); rows.get(r).push(q); }
  const p = new Path2D();
  for (const [r, qs] of rows) {
    qs.sort((a, b) => a - b);
    let s = qs[0], prev = qs[0];
    for (let i = 1; i <= qs.length; i++) {
      const q = qs[i];
      if (q === prev + 1) { prev = q; continue; }
      p.rect(ox + s * c, oy + r * c, (prev - s + 1) * c, c);
      s = q; prev = q;
    }
  }
  return p;
}

/* ---------- TITLE: 娜乌斯嘉AI ---------- */
const TE = 30, TC = 8;                     // glyph em in cells, cell size in px
const TSTR = '娜乌斯嘉AI';
const TM = textMask(TSTR, TE, 700);
let tMinC = 1e9, tMaxC = -1, tMinR = 1e9, tMaxR = -1;
for (let r = 0; r < TM.ch; r++) for (let q = 0; q < TM.cw; q++) if (TM.m[r * TM.cw + q]) {
  tMinC = Math.min(tMinC, q); tMaxC = Math.max(tMaxC, q); tMinR = Math.min(tMinR, r); tMaxR = Math.max(tMaxR, r);
}
const TITLE_CY = 418;
const TOX = Math.round(960 - ((tMaxC - tMinC + 1) * TC) / 2) - tMinC * TC;   // screen x of cell col 0
const TOY = Math.round(TITLE_CY - ((tMaxR - tMinR + 1) * TC) / 2) - tMinR * TC;
const TXL = TOX + tMinC * TC, TXR = TOX + (tMaxC + 1) * TC, TYT = TOY + tMinR * TC, TYB = TOY + (tMaxR + 1) * TC;
const TW = TXR - TXL;
const CH = [];
for (let k = 0; k < TSTR.length; k++) CH.push({ cells: [], x0: 1e9, x1: -1e9, y0: 1e9, y1: -1e9 });
const TCELLS = [];
for (let r = 0; r < TM.ch; r++) for (let q = 0; q < TM.cw; q++) if (TM.m[r * TM.cw + q]) {
  let k = 0; while (k < TSTR.length - 1 && q + 0.5 >= TM.bounds[k + 1]) k++;
  const ch = CH[k]; ch.cells.push([q, r]);
  const x = TOX + q * TC, y = TOY + r * TC;
  ch.x0 = Math.min(ch.x0, x); ch.x1 = Math.max(ch.x1, x + TC); ch.y0 = Math.min(ch.y0, y); ch.y1 = Math.max(ch.y1, y + TC);
  TCELLS.push({ x, y, k });
}
for (const ch of CH) {
  ch.path = cellsToPath(ch.cells, TOX, TOY, TC);
  ch.cx = (ch.x0 + ch.x1) / 2;
  // landing point on the top of the glyph: the highest cell row near the centre column band
  let top = 1e9;
  for (const [q, r] of ch.cells) { const x = TOX + q * TC + TC / 2; if (Math.abs(x - ch.cx) < (ch.x1 - ch.x0) * 0.22) top = Math.min(top, TOY + r * TC); }
  ch.top = top < 1e9 ? top : ch.y0;
}
// period spot (red pixel full stop after "AI")
const PSZ = 24;
const PER = { x: CH[5].x1 + 4 * TC + PSZ / 2, y: TYB };   // centre-x, bottom-y
// glow canvases per char (soft bloom behind crisp faces)
function makeGlow(ch, col) {
  const m = 60, w = Math.ceil(ch.x1 - ch.x0 + 2 * m), h = Math.ceil(ch.y1 - ch.y0 + 2 * m);
  const a = mk(w, h), ag = a.getContext('2d');
  ag.translate(m - ch.x0, m - ch.y0); ag.fillStyle = css(col); ag.fill(ch.path);
  const b = mk(w, h), bg = b.getContext('2d');
  bg.filter = 'blur(26px)'; bg.globalAlpha = 0.85; bg.drawImage(a, 0, 0);
  bg.filter = 'blur(9px)'; bg.globalAlpha = 0.55; bg.drawImage(a, 0, 0);
  bg.filter = 'none';
  return { c: b, x: ch.x0 - m, y: ch.y0 - m };
}
CH.forEach((ch, k) => { ch.glow = makeGlow(ch, k >= 4 ? YELc : CREc); });
// dark plate behind title (keeps grid from crossing the letters)
function makePlate(x0, y0, x1, y1, pad, blur) {
  const m = blur * 2 + pad, w = Math.ceil(x1 - x0 + 2 * m), h = Math.ceil(y1 - y0 + 2 * m);
  const c = mk(w, h), g = c.getContext('2d');
  g.filter = `blur(${blur}px)`; g.fillStyle = BG; g.fillRect(m - pad, m - pad, x1 - x0 + 2 * pad, y1 - y0 + 2 * pad);
  return { c, x: x0 - m, y: y0 - m };
}
const TPLATE = makePlate(TXL, TYT, PER.x + 20, TYB, 34, 30);

/* ---------- SUBTITLE: 记得关注我 带你拥抱未来 ---------- */
const SE = 18, SC = 4;
const SSTR = '记得关注我 带你拥抱未来';
const SM = textMask(SSTR, SE, 700);
function glyphCells(chr) {                      // one glyph rendered alone at origin
  const mm = textMask(chr, SE, 700); const cells = [];
  for (let r = 0; r < mm.ch; r++) for (let q = 0; q < mm.cw; q++) if (mm.m[r * mm.cw + q]) cells.push([q - mm.pad, r]);
  return cells;
}
const SLOTS = [];
let sMinR = 1e9, sMaxR = -1;
for (let i = 0; i < SSTR.length; i++) {
  if (SSTR[i] === ' ') continue;
  const cells = glyphCells(SSTR[i]);
  for (const [, r] of cells) { sMinR = Math.min(sMinR, r); sMaxR = Math.max(sMaxR, r); }
  SLOTS.push({ chr: SSTR[i], col: Math.round(SM.bounds[i] - SM.pad), cells });
}
const S_TOTALW = Math.round((SM.bounds[SSTR.length] - SM.pad)) * SC;
const SOX = Math.round(960 - S_TOTALW / 2);
const TITLE_UP = -44;                                 // title rises at 13 s
const SOY = TYB + TITLE_UP + 34 - sMinR * SC;         // subtitle tucked right under the title
for (const s of SLOTS) {
  s.x = SOX + s.col * SC;
  s.path = cellsToPath(s.cells, s.x, SOY, SC);
}
const S_Y0 = SOY + sMinR * SC, S_Y1 = SOY + (sMaxR + 1) * SC;
const SPLATE = makePlate(SOX - 10, S_Y0, SOX + S_TOTALW + 10, S_Y1, 26, 22);
// subtitle glow canvas
const SGLOW = (() => {
  const m = 50, w = S_TOTALW + 2 * m, h = (S_Y1 - S_Y0) + 2 * m;
  const a = mk(w, h), ag = a.getContext('2d'); ag.translate(m - SOX, m - S_Y0); ag.fillStyle = css(CREc);
  for (const s of SLOTS) ag.fill(s.path);
  const b = mk(w, h), bg = b.getContext('2d'); bg.filter = 'blur(10px)'; bg.drawImage(a, 0, 0); bg.filter = 'none';
  return { c: b, x: SOX - m, y: S_Y0 - m };
})();
// scramble pool (random hanzi, pre-binarized)
const POOLSTR = '光年数据星河代码信号电流算法宇宙梦境频道像素未来拥抱关注记得带你我们时空回声幻影深空引擎协议矩阵量子网络脉冲波形芯片磁场轨道粒子火花极光棱镜晶体终端坐标维度意识觉醒镜像核心心跳节拍旋律和弦霓虹黄昏黎明夜幕海潮风暴雷鸣闪烁';
const POOL = [];
for (const chr of POOLSTR) POOL.push(cellsToPath(glyphCells(chr), 0, 0, SC));

/* ---------- SUN (pixel disc, 72 cell rows, stepped colour bands, lower gaps) ---------- */
const SUN_N = 72, SUN_R0 = 250;
const SUN_GAPS = new Set([39, 43, 44, 48, 49, 53, 54, 55, 59, 60, 61]);
const HY0 = 560;
function sunR(t) { return SUN_R0 * (1 - 0.28 * eIOC((t - 3.5) / 0.483)); }
function sunRowColor(r) { const band = Math.floor(r / 6) / 11; return mix(YELc, REDc, Math.pow(band, 1.05)); }
function sunRows(R, hy, fn) {
  const cx = 960, cy = hy - 0.7 * R, cs = 2 * R / SUN_N, half = SUN_N / 2;
  for (let r = 0; r < SUN_N; r++) {
    if (SUN_GAPS.has(r)) continue;
    const v = (r + 0.5) / half - 1, h = Math.sqrt(Math.max(0, 1 - v * v));
    const q0 = Math.ceil(half * (1 - h) - 0.5), q1 = Math.floor(half * (1 + h) - 0.5);
    if (q1 < q0) continue;
    const y0 = Math.round(cy - R + r * cs), y1 = Math.round(cy - R + (r + 1) * cs);
    if (y0 >= hy) continue;
    fn(r, q0, q1, y0, y1, cx, cy, cs);
  }
}

/* ---------- PARTICLES (born from the sun's cells at the explosion frame) ---------- */
const P_R = SUN_R0 * 0.72;
const SUNC = { x: 960, y: HY0 - 0.7 * P_R };
const PART = [];
{
  const rnd = mulberry(1234);
  sunRows(P_R, HY0, (r, q0, q1, y0, y1, cx, cy, cs) => {
    const col = sunRowColor(r);
    for (let q = q0; q <= q1; q++) {
      const x0 = Math.round(cx - P_R + q * cs), x1 = Math.round(cx - P_R + (q + 1) * cs);
      PART.push({ ox: (x0 + x1) / 2, oy: (y0 + y1) / 2, cs: x1 - x0, col: rnd() < 0.2 ? CREc : col });
    }
  });
  const Cx = 960, Cy = TITLE_CY + 6, Rx = 830, Ry = 165;
  for (const p of PART) {
    let dx = p.ox - SUNC.x, dy = p.oy - SUNC.y; let L = Math.hypot(dx, dy) || 1; dx /= L; dy /= L;
    const ang = Math.atan2(dy, dx) + (rnd() - 0.5) * 0.7;
    p.z = rnd();                                  // 0 far .. 1 near
    p.dx = Math.cos(ang); p.dy = Math.sin(ang);
    p.dist = (220 + 880 * Math.pow(rnd(), 0.75)) * (0.55 + 0.9 * p.z) * (0.6 + 0.6 * L / P_R);
    // exploded position at 4.4 -> choose orbit phase so the vortex picks it up where it is
    const g = 1 - Math.exp(-3.6 * 0.35);
    const ex = p.ox + p.dx * p.dist * g, ey = p.oy + p.dy * p.dist * g;
    p.rho = 0.62 + 0.55 * rnd();
    p.phi0 = Math.atan2((ex - Cx) / Rx, (ey - Cy) / Ry);
    p.w = 2.3 + 0.9 * rnd();
  }
  // targets: title cells, written left -> right
  const order = PART.map((p, i) => i);
  for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  const invE = x => Math.acos(1 - 2 * clamp(x)) / Math.PI;   // inverse of eIOS
  order.forEach((pi, n) => {
    const p = PART[pi];
    const cell = n < TCELLS.length ? TCELLS[n] : TCELLS[Math.floor(rnd() * TCELLS.length)];
    p.tx = cell.x + TC / 2; p.ty = cell.y + TC / 2; p.cell = n < TCELLS.length ? n : -1;
    const xn = (cell.x + TC / 2 - TXL) / TW;
    p.T = 4.95 + 1.55 * invE(xn) * 0.965 + rnd() * 0.05;
    p.F = 0.5 + 0.55 * rnd();
    p.dep = p.T - p.F;
    p.bx = -(110 + 170 * rnd()); p.by = (rnd() - 0.6) * 160;
    if (p.cell >= 0) cell.T = p.T;
  });
  for (const c of TCELLS) if (c.T === undefined) c.T = 6.5;
}
const CELLS_BY_T = TCELLS.slice().sort((a, b) => a.T - b.T);
const P_CX = 960, P_CY = TITLE_CY + 6, P_RX = 830, P_RY = 165;
function preFlight(p, t, o) {
  const u = Math.max(0, t - 4.032), g = 1 - Math.exp(-3.6 * u);
  const ex = p.ox + p.dx * p.dist * g, ey = p.oy + p.dy * p.dist * g;
  if (t < 4.4) { o.x = ex; o.y = ey; o.z = p.z; return o; }
  const s = sm((t - 4.4) / 0.75), tt = t - 4.4;
  const phi = p.phi0 + p.w * tt + 0.35 * tt * tt;
  const rr = p.rho * (1 - 0.32 * sm((t - 4.8) / 1.6));
  const qx = P_CX + P_RX * rr * Math.sin(phi), qy = P_CY + P_RY * rr * Math.cos(phi);
  o.x = lerp(ex, qx, s); o.y = lerp(ey, qy, s); o.z = lerp(p.z, 0.5 + 0.5 * Math.cos(phi), s);
  return o;
}
const _a = { x: 0, y: 0, z: 0 }, _b = { x: 0, y: 0, z: 0 };
function partPos(p, t, o) {             // returns x,y,z,q (q: 0 free .. 1 landed blend)
  if (t >= p.T) { o.x = p.tx; o.y = p.ty; o.z = 0.5; o.q = 1; return o; }
  if (t < p.dep) { preFlight(p, t, o); o.q = 0; return o; }
  preFlight(p, p.dep, _a); preFlight(p, p.dep - 1 / 120, _b);
  const vx = (_a.x - _b.x) * 120 * 0.85, vy = (_a.y - _b.y) * 120 * 0.85;
  const u = (t - p.dep) / p.F, e = u + u * u - u * u * u;          // starts at orbit speed, eases into the cell
  const x0 = _a.x, y0 = _a.y, x1 = x0 + vx * p.F / 3, y1 = y0 + vy * p.F / 3;
  const x2 = p.tx + p.bx, y2 = p.ty + p.by, x3 = p.tx, y3 = p.ty;
  const m = 1 - e;
  o.x = m * m * m * x0 + 3 * m * m * e * x1 + 3 * m * e * e * x2 + e * e * e * x3;
  o.y = m * m * m * y0 + 3 * m * m * e * y1 + 3 * m * e * e * y2 + e * e * e * y3;
  o.z = lerp(_a.z, 0.5, e); o.q = sm((u - 0.3) / 0.7);
  return o;
}

/* ---------- glow sprites ---------- */
function glowSprite(col, size = 256) {
  const c = mk(size, size), g = c.getContext('2d'), r = size / 2;
  const gr = g.createRadialGradient(r, r, 0, r, r, r);
  gr.addColorStop(0, rgba(col, 1)); gr.addColorStop(0.25, rgba(col, 0.55)); gr.addColorStop(0.55, rgba(col, 0.16)); gr.addColorStop(1, rgba(col, 0));
  g.fillStyle = gr; g.fillRect(0, 0, size, size); return c;
}
const GL_RED = glowSprite(REDc), GL_CRE = glowSprite(CREc), GL_YEL = glowSprite(YELc);
function drawGlow(C, spr, x, y, r, a) {
  if (a <= 0.002 || r <= 0) return;
  C.globalCompositeOperation = 'lighter'; C.globalAlpha = clamp(a);
  C.drawImage(spr, x - r, y - r, 2 * r, 2 * r);
  C.globalCompositeOperation = 'source-over'; C.globalAlpha = 1;
}

/* ---------- film grain tiles & circular vignette (dithered) ---------- */
const GRAIN = [];
for (let n = 0; n < 6; n++) {
  const c = mk(256, 256), g = c.getContext('2d'), id = g.createImageData(256, 256), rnd = mulberry(77 + n);
  for (let i = 0; i < 256 * 256; i++) {
    const v = rnd();
    if (v < 0.5) { id.data[i * 4] = 236; id.data[i * 4 + 1] = 232; id.data[i * 4 + 2] = 225; id.data[i * 4 + 3] = Math.round((0.5 - v) * 2 * 255 * 0.04); }
    else { id.data[i * 4 + 3] = Math.round((v - 0.5) * 2 * 255 * 0.055); }
  }
  g.putImageData(id, 0, 0); GRAIN.push(X.createPattern(c, 'repeat'));
}
const VIG = (() => {
  const c = mk(W, H), g = c.getContext('2d'), id = g.createImageData(W, H), rnd = mulberry(99);
  const R = Math.hypot(W / 2, H / 2);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const d = Math.hypot(x - W / 2, y - H / 2) / R;
    const a = Math.pow(sm((d - 0.42) / 0.58), 1.15) * 0.62;
    const i = (y * W + x) * 4; id.data[i + 3] = clamp(a + (rnd() - 0.5) / 255) * 255;
  }
  g.putImageData(id, 0, 0); return c;
})();
const SCAN = (() => { const c = mk(4, 4), g = c.getContext('2d'); g.fillStyle = 'rgba(0,0,0,1)'; g.fillRect(0, 0, 4, 1); return X.createPattern(c, 'repeat'); })();
const SCAN3 = (() => { const c = mk(3, 3), g = c.getContext('2d'); g.fillStyle = 'rgba(0,0,0,1)'; g.fillRect(0, 0, 3, 1); return X.createPattern(c, 'repeat'); })();

    while (lo < hi) { const mid = (lo + hi) >> 1; if (CELLS_BY_T[mid].T <= t) lo = mid + 1; else hi = mid; }
    n = lo; if (!n) return;
    const pa = new Path2D(), pf = new Path2D();
    for (let i = 0; i < n; i++) { const c = CELLS_BY_T[i]; (t - c.T < 0.07 ? pf : pa).rect(c.x, c.y, TC, TC); }
    const e1 = t >= 6.5 ? Math.round(TC * eOutBack((t - 6.5 + F1) / 0.1, 3)) : 0, e2 = t >= 6.583 ? Math.round(TC * eOutBack((t - 6.583 + F1) / 0.1, 3)) : 0;
    if (e2 > 0) { C.save(); C.translate(e1 + e2, e1 + e2); C.fillStyle = css(DREDc); C.fill(pa); C.fill(pf); C.restore(); }
    if (e1 > 0) { C.save(); C.translate(e1, e1); C.fillStyle = css(REDc); C.fill(pa); C.fill(pf); C.restore(); }
    C.fillStyle = css(FACEc); C.fill(pa); C.fillStyle = 'rgb(247,244,238)'; C.fill(pf);
    return;
  }
  const e1 = Math.round(TC * eOutBack((t - 6.5 + F1) / 0.1, 3)), e2 = Math.round(TC * eOutBack((t - 6.583 + F1) / 0.1, 3));
  const dys = []; for (let k = 0; k < 6; k++) dys.push(charDY(t, k));
  // glow behind (additive, below crisp faces)
  for (let k = 0; k < 6; k++) {
    let g = glowLevel(t, k) * 0.75;
    if (k <= 5 && t >= LAND[k]) g += 0.9 * Math.exp(-(t - LAND[k]) / 0.14);
    if (t >= 7 && k >= 4) g += 0.8 * Math.exp(-(t - 7) / 0.16);
    if (t >= 12 && t < 13.2) { const bx = lerp(TXL - 260, TXR + 260, eIOS((t - 12) / 1.0)); g += 0.55 * Math.exp(-(((CH[k].cx - bx) / 170) ** 2)); }
    if (t >= 13.0 && t < 13.5) g += 0.3 * Math.exp(-(t - 13) / 0.12);
    if (g > 0.003) {
      C.globalCompositeOperation = 'lighter'; C.globalAlpha = clamp(g * 0.55);
      C.drawImage(CH[k].glow.c, CH[k].glow.x, CH[k].glow.y + dys[k]);
      C.globalCompositeOperation = 'source-over'; C.globalAlpha = 1;
    }
  }
  const sweep = t >= 12 && t < 13.15;
  const bx = sweep ? lerp(TXL - 260, TXR + 260, eIOS((t - 12) / 1.0)) : 0;
  const sweepFill = (base, hiC, k) => {
    if (!sweep || Math.abs(CH[k].cx - bx) > (CH[k].x1 - CH[k].x0) / 2 + 260) return css(base);
    const g = C.createLinearGradient(bx - 170, TITLE_CY - 70, bx + 170, TITLE_CY + 70);   // slanted band
    g.addColorStop(0, css(base)); g.addColorStop(0.4, css(mix(base, hiC, 0.55))); g.addColorStop(0.5, css(hiC));
    g.addColorStop(0.6, css(mix(base, hiC, 0.55))); g.addColorStop(1, css(base));
    return g;
  };
  for (let k = 0; k < 6; k++) {
    C.save(); C.translate(e1 + e2, e1 + e2 + dys[k]); C.fillStyle = sweepFill(DREDc, REDc, k); C.fill(CH[k].path); C.restore();
  }
  for (let k = 0; k < 6; k++) {
    C.save(); C.translate(e1, e1 + dys[k]); C.fillStyle = sweepFill(REDc, [255, 178, 160], k); C.fill(CH[k].path); C.restore();
  }
  if (gl > 0) {                                   // glitch: red / yellow / cream separation
    const f = Math.floor((t - 8) * 30);
    const d1 = Math.round((8 + 10 * hash(f, 31)) * gl), d2 = Math.round((6 + 12 * hash(f, 32)) * gl);
    for (let k = 0; k < 6; k++) {
      C.save(); C.translate(-d1, dys[k] + Math.round((hash(f, 33) - 0.5) * 6 * gl)); C.fillStyle = css(REDc); C.fill(CH[k].path); C.restore();
      C.save(); C.translate(d2, dys[k] - Math.round((hash(f, 34) - 0.5) * 6 * gl)); C.fillStyle = css(YELc); C.fill(CH[k].path); C.restore();
    }
  }
  for (let k = 0; k < 6; k++) {
    const base = faceColor(t, k);
    C.save(); C.translate(0, dys[k]);
    C.fillStyle = sweepFill(base, k >= 4 ? [253, 234, 178] : [248, 240, 222], k);
    C.fill(CH[k].path);
    C.restore();
  }
}
function drawBlock(C, x, bottom, s, sx, sy, lit) {
  const w = Math.max(1, Math.round(s * sx)), h = Math.max(1, Math.round(s * sy));
  const x0 = Math.round(x - w / 2), y0 = Math.round(bottom - h);
  C.fillStyle = css(REDc); C.fillRect(x0, y0, w, h);
  if (s >= 14) {
    const u = Math.max(2, Math.round(s / 8));
    C.fillStyle = css(DREDc); C.fillRect(x0, y0 + h - Math.round(u * sy), w, Math.round(u * sy)); C.fillRect(x0 + w - Math.round(u * sx), y0, Math.round(u * sx), h);
    C.fillStyle = css(mix(REDc, CREc, 0.45 + 0.4 * lit)); C.fillRect(x0 + Math.round(u * sx), y0 + Math.round(u * sy), Math.round(2 * u * sx), Math.round(u * sy));
    C.fillRect(x0 + Math.round(u * sx), y0 + Math.round(u * sy), Math.round(u * sx), Math.round(2 * u * sy));
  }
}
function drawPenGlow(C, t) {     // glow goes BEHIND the title so it never washes the letters
  const p = pen(t); if (!p.vis) return;
  drawGlow(C, GL_RED, p.x, p.y - p.s * p.sy / 2, p.s * 0.95 * Math.max(p.sx, p.sy), p.glow);
}
function drawPen(C, t) {
  const p = pen(t); if (!p.vis) return;
  drawBlock(C, p.x, p.y, p.s, p.sx, p.sy, 0);
}
// splash debris on each landing
const IMPACTS = [...LAND.map((L, k) => ({ t: L, k })), { t: 12.0, k: 6 }];
function drawDebris(C, t) {
  for (const im of IMPACTS) {
    const tau = t - im.t; if (tau < 0 || tau > 0.6) continue;
    const lp = landPoint(im.t, im.k);
    for (let j = 0; j < 9; j++) {
      const h1 = hash(j, im.k, 5), h2 = hash(j, im.k, 6), h3 = hash(j, im.k, 8);
      const side = j % 2 ? 1 : -1;
      const vx = side * (90 + 320 * h1), vy = -(220 + 380 * h2), g = 1500;
      const x = lp.x + side * 30 + vx * tau, y = lp.y - 4 + vy * tau + 0.5 * g * tau * tau;
      const life = 0.35 + 0.25 * h3; if (tau > life) continue;
      const s = tau < life * 0.55 ? (h3 < 0.5 ? 8 : 6) : 4;
      C.fillStyle = css(j % 3 === 0 ? CREc : (im.k >= 4 && im.k < 6 && j % 3 === 1 ? YELc : REDc));
      C.fillRect(Math.round(x - s / 2), Math.round(y - s / 2), s, s);
    }
  }
}
function drawSubtitle(C, t) {
  if (t < 13.0) return;
  const lt = t - 13.0;
  const appear = sm((lt + F1) / 0.04);
  C.save(); C.translate(0, titleShift(t) - TITLE_UP);      // rides up together with the title, always tucked under it
  // plate: darken grid behind the words
  C.globalAlpha = appear; C.drawImage(SPLATE.c, SPLATE.x, SPLATE.y); C.globalAlpha = 1;
  let glowA = 0;
  if (t >= 13.55) glowA = 0.1;
  if (t >= 13.7) glowA += 0.4 * Math.exp(-(t - 13.7) / 0.18);
  if (glowA > 0) { C.globalCompositeOperation = 'lighter'; C.globalAlpha = glowA; C.drawImage(SGLOW.c, SGLOW.x, SGLOW.y); C.globalCompositeOperation = 'source-over'; C.globalAlpha = 1; }
  const step = Math.floor(lt / 0.05);
  SLOTS.forEach((s, k) => {
    const lock = 13.1 + 0.044 * k;
    if (t >= lock) {
      const fl = Math.exp(-(t - lock) / 0.07);
      let col = mix(CREc, [248, 246, 241], fl);
      if (t >= 13.7) col = mix(col, [246, 243, 237], 0.6 * Math.exp(-(t - 13.7) / 0.15));
      C.fillStyle = css(col); C.fill(s.path);
    } else {
      const h = hash(k, step, 3), red = hash(k, step, 4) < 0.18;
      const g = POOL[Math.floor(h * POOL.length)];
      C.save(); C.translate(s.x, SOY); C.globalAlpha = appear;
      C.fillStyle = css(red ? REDc : mix(CREc, BGc, 0.28)); C.fill(g); C.restore(); C.globalAlpha = 1;
    }
  });
  C.restore();
}

/* ---------- post: glitch slices & CRT power-off ---------- */
const BUF = mk(W, H), BX = BUF.getContext('2d');
function glitchI(t) { const lt = t - 8; return lt < 0 ? 0 : lt < 0.2 ? 1 - 0.25 * (lt / 0.2) : lt < 0.22 ? 0 : lt < 0.4 ? 0.55 * (1 - 0.3 * (lt - 0.22) / 0.18) : 0; }
function applyGlitch(t) {
  const I = glitchI(t), lt = t - 8, f = Math.floor(lt * 30) + (lt >= 0.22 ? 50 : 0);
  X.setTransform(1, 0, 0, 1, 0, 0); X.fillStyle = BG; X.fillRect(0, 0, W, H);
  if (I <= 0) { X.drawImage(BUF, 0, 0); return; }
  const n = 6 + Math.floor(hash(f, 1) * 5);
  // two cuts always run through the title so the letters themselves tear apart
  const cuts = [0, (330 + 70 * hash(f, 20)) / H, (430 + 80 * hash(f, 21)) / H];
  for (let i = 3; i < n; i++) cuts.push(hash(f, 2, i)); cuts.push(1);
  cuts.sort((a, b) => a - b);
  for (let i = 0; i < cuts.length - 1; i++) {
    const y0 = Math.round(cuts[i] * H), y1 = Math.round(cuts[i + 1] * H); if (y1 <= y0) continue;
    const mid = (y0 + y1) / 2, inTitle = mid > 300 && mid < 560;
    const sg = (hash(f, 4, i) < 0.5 ? -1 : 1) * (inTitle && i % 2 ? -1 : 1);
    const dx = !inTitle && hash(f, 3, i) < 0.2 ? 0 : Math.round(sg * ((inTitle ? 40 : 20) + 140 * hash(f, 13, i)) * I);
    X.drawImage(BUF, 0, y0, W, y1 - y0, dx, y0, W, y1 - y0);
  }
  // a few palette data-blocks
  for (let i = 0; i < Math.round(5 * I); i++) {
    const y = Math.round(hash(f, 5, i) * H / 8) * 8, x = Math.round(hash(f, 6, i) * W / 8) * 8, w = 8 * (6 + Math.floor(hash(f, 7, i) * 40)), h = 8 * (1 + Math.floor(hash(f, 8, i) * 2));
    const cc = [REDc, YELc, CREc][Math.floor(hash(f, 9, i) * 3)];
    X.globalAlpha = 0.18 + 0.25 * hash(f, 10, i); X.fillStyle = css(cc); X.fillRect(x, y, w, h);
  }
  X.globalAlpha = 0.32 * I; X.fillStyle = SCAN3; X.fillRect(0, 0, W, H); X.globalAlpha = 1;
}
function applyCRT(t) {
  const a = t - 15 + F1;
  X.setTransform(1, 0, 0, 1, 0, 0); X.fillStyle = '#000'; X.fillRect(0, 0, W, H);
  if (a < 0.1) {
    const u = eInQ(a / 0.1), sy = lerp(1, 0.004, u), h = Math.max(3, H * sy), y = 540 - h / 2;
    X.globalCompositeOperation = 'screen';
    const gg = X.createLinearGradient(0, 540 - 90, 0, 540 + 90);
    gg.addColorStop(0, rgba(REDc, 0)); gg.addColorStop(0.5, rgba(REDc, 0.5 * u)); gg.addColorStop(1, rgba(REDc, 0));
    X.fillStyle = gg; X.fillRect(0, 450, W, 180);
    X.globalCompositeOperation = 'source-over';
    X.drawImage(BUF, 0, y, W, h);
    X.globalCompositeOperation = 'screen';                  // the picture burns brighter as it collapses
    X.globalAlpha = clamp(u * 1.4); X.drawImage(BUF, 0, y, W, h);
    X.globalAlpha = 1;
    const cg = X.createLinearGradient(0, y, 0, y + h);
    cg.addColorStop(0, 'rgba(246,242,234,0)'); cg.addColorStop(0.5, rgba([246, 242, 234], 0.9 * u)); cg.addColorStop(1, 'rgba(246,242,234,0)');
    X.fillStyle = cg; X.fillRect(0, y, W, h);
    X.globalCompositeOperation = 'source-over';
  } else if (a < 0.28) {
    const u = eInC((a - 0.1) / 0.18), w = Math.max(6, W * (1 - u)), th = lerp(4, 3, u);
    const gg = X.createLinearGradient(0, 540 - 50, 0, 540 + 50);
    gg.addColorStop(0, rgba(REDc, 0)); gg.addColorStop(0.5, rgba(REDc, 0.4 * (1 - u * 0.5))); gg.addColorStop(1, rgba(REDc, 0));
    X.fillStyle = gg; X.fillRect(960 - w / 2 - 40, 490, w + 80, 100);
    X.fillStyle = 'rgb(246,242,234)'; X.fillRect(Math.round(960 - w / 2), Math.round(540 - th / 2), Math.round(w), Math.round(th));
  } else if (a < 0.38) {
    const u = (a - 0.28) / 0.1, s = Math.round(lerp(6, 0, eInQ(u)));
    if (s > 0) { drawGlow(X, GL_RED, 960, 540, 40, 0.5 * (1 - u)); X.fillStyle = 'rgb(246,242,234)'; X.fillRect(960 - s / 2, 540 - s / 2, s, s); }
  }
  // phosphor afterglow of the collapsed line, fading out
  if (a >= 0.26 && a < 0.72) {
    const v = 1 - sm((a - 0.26) / 0.46), w = W * 0.5 * (0.35 + 0.65 * v);
    const gg = X.createLinearGradient(960 - w, 0, 960 + w, 0);
    gg.addColorStop(0, rgba(REDc, 0)); gg.addColorStop(0.5, rgba(REDc, 0.16 * v)); gg.addColorStop(1, rgba(REDc, 0));
    X.fillStyle = gg; X.fillRect(960 - w, 539, 2 * w, 2);
  }
  // the full stop survives: slides to centre, flashes, then goes out
  const p0 = penScreenPos(15.0), z = camera(15.0).z;
  const u = eIOC((t - 15.1) / 0.4);
  const x = lerp(p0.x, 960, u), y = lerp(p0.y, 540, u);
  let s = PSZ * lerp(z, 1, u), ga = 0.5;
  if (t >= 15.5) { const fl = Math.exp(-(t - 15.5) / 0.07); s *= 1 + 0.3 * fl; ga += 1.2 * fl; }
  if (t >= 15.5 && t < 15.7) ga += 0.15 * Math.sin((t - 15.5) * 30) ** 2;
  if (t >= 15.7) { const k = clamp((t - 15.7) / 0.05); s *= 1 - eInQ(k); ga *= 1 - k; ga += t < 15.72 ? 0.6 : 0; }
  if (s >= 1) {
    drawGlow(X, GL_RED, x, y, s * 1.6, ga);
    if (t >= 15.5 && t < 15.62) drawGlow(X, GL_YEL, x, y, s * 1.4, 0.35 * Math.exp(-(t - 15.5) / 0.05));
    drawBlock(X, x, y + s / 2, s, 1, 1, 0);
  }
}
function grainVignette(C, t) {
  C.setTransform(1, 0, 0, 1, 0, 0);
  C.globalAlpha = 1; C.globalCompositeOperation = 'source-over';
  const f = Math.round(t * FPS);
  C.drawImage(VIG, 0, 0);
  C.save(); C.translate(Math.floor(hash(f, 91) * 256), Math.floor(hash(f, 92) * 256));
  C.fillStyle = GRAIN[Math.floor(hash(f, 93) * GRAIN.length)]; C.fillRect(-256, -256, W + 256, H + 256); C.restore();
}

/* ---------- master ---------- */
function drawScene(C, t, post) {
  C.setTransform(1, 0, 0, 1, 0, 0); C.globalAlpha = 1; C.globalCompositeOperation = 'source-over';
  C.fillStyle = BG; C.fillRect(0, 0, W, H);
  const P = world(t), cam = P.cam;
  // ---- background world (follows the camera's sway, not its zoom) ----
  if (t < 4) { C.translate(960, P.hy); C.rotate(P.roll); C.translate(-960, -P.hy); }
  else applyCam(C, cam, false);
  drawStars(C, t, P);
  drawHorizon(C, P, t);
  if (t < 4.045) drawSun(C, t, P);
  drawTerrain(C, P);
  drawHaze(C, P);
  C.setTransform(1, 0, 0, 1, 0, 0);
  // explosion bloom (local)
  if (t >= 4.045 && t < 4.6) {
    const e = Math.exp(-(t - 4.05) / 0.09);
    drawGlow(C, GL_CRE, SUNC.x, SUNC.y, 200 + 300 * (t - 4.05), 0.5 * e);
    drawGlow(C, GL_YEL, SUNC.x, SUNC.y, 330 + 300 * (t - 4.05), 0.22 * e);
  }
  // ---- foreground in camera space ----
  applyCam(C, cam, true);
  if (t >= 6.4) {
    const pa = 0.92 * sm((t - 6.4) / 1.4);
    C.globalAlpha = pa; C.drawImage(TPLATE.c, TPLATE.x, TPLATE.y + titleShift(t)); C.globalAlpha = 1;
  }
  if (post !== 'crt') drawPenGlow(C, t);
  if (t >= 4.95) drawTitle(C, t, post === 'glitch' ? glitchI(t) : 0);
  if (t >= 4.045 && t < 6.6) drawParticles(C, t);
  drawSubtitle(C, t);
  drawDebris(C, t);
  if (post !== 'crt') drawPen(C, t);
  C.setTransform(1, 0, 0, 1, 0, 0);
  // slow drifting scanlines over the title section
  if (t >= 8) {
    const a = 0.06 * sm((t - 8) / 0.4);
    C.save(); C.translate(0, Math.floor(t * 9) % 4); C.globalAlpha = a; C.fillStyle = SCAN; C.fillRect(0, -4, W, H + 8); C.restore();
    const by = ((t - 8) * 120) % (H + 400) - 200;
    const g = C.createLinearGradient(0, by - 140, 0, by + 140);
    g.addColorStop(0, rgba(CREc, 0)); g.addColorStop(0.5, rgba(CREc, 0.022)); g.addColorStop(1, rgba(CREc, 0));
    C.globalCompositeOperation = 'lighter'; C.fillStyle = g; C.fillRect(0, by - 140, W, 280); C.globalCompositeOperation = 'source-over';
    C.globalAlpha = 1;
  }
}

let overlayHidden = false;
function hideOverlay() { if (!overlayHidden) { const o = document.getElementById('play'); if (o) o.style.display = 'none'; overlayHidden = true; } }
function draw(t) {
  t = clamp(+t || 0, 0, 16);
  X.setTransform(1, 0, 0, 1, 0, 0); X.globalAlpha = 1; X.globalCompositeOperation = 'source-over';
  if (t >= 15.75) { X.fillStyle = '#000'; X.fillRect(0, 0, W, H); return; }
  const post = (t >= 8 && t < 8.4) ? 'glitch' : (t >= 15.0 ? 'crt' : null);
  if (post === 'crt') { drawScene(BX, t, post); grainVignette(BX, t); applyCRT(t); return; }
  if (post === 'glitch') { drawScene(BX, t, post); applyGlitch(t); grainVignette(X, t); return; }
  drawScene(X, t, post); grainVignette(X, t);
}
window.renderFrame = function (t) { hideOverlay(); draw(t); };

/* ---------- interactive playback ---------- */
const au = document.getElementById('au');
draw(0);
document.getElementById('btn').addEventListener('click', () => {
  hideOverlay();
  au.currentTime = 0;
  const p = au.play(); if (p && p.catch) p.catch(() => {});
  const loop = () => { draw(au.currentTime); if (!au.ended && au.currentTime < 16) requestAnimationFrame(loop); else draw(16); };
  requestAnimationFrame(loop);
});
console.log('particles', PART.length, 'title cells', TCELLS.length, 'title px', TXL, TXR, TW, TYT, TYB, 'sub', SOX, S_TOTALW, S_Y0, S_Y1);
</script>
